id: si_momentum_downside_scan

question: >
  Är hög förändring i short interest särskilt associerad
  med downside-risk när tidigare momentum är högt?

mode: scan

signals:
  - name: short_interest_change
    direction: upper
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025
      - 0.01

  - name: price_momentum_20d
    direction: upper
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025
      - 0.01

targets:
  - down_5pct_5d
  - down_7pct_5d
  - down_10pct_5d

analysis:
  type: interaction
  bootstrap: false

windows:
  - window_1
  - window_2

splits:
  - test

metadata:
  stage: migration
  purpose: scan
