id: fi_change_volatility_interaction_scan

question: >
  Är downside-event-risk särskilt hög när short interest ökar samtidigt
  som volatiliteten är hög?

mode: scan

signals:
  - name: short_interest_change
    direction: upper
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025
      - 0.01

  - name: price_volatility_20d
    direction: upper
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025
      - 0.01

targets:
  - down_5pct_5d
  - down_7pct_5d
  - down_10pct_5d
  - down_5pct_20d
  - down_10pct_60d

analysis:
  type: interaction
  bootstrap: false

windows:
  - window_1
  - window_2

splits:
  - test

metadata:
  stage: signal_mapping
  purpose: fi_change_volatility_interaction
  hypothesis: >
    En kombination av stigande short interest och hög volatilitet
    kan identifiera en särskild downside-riskpopulation.
