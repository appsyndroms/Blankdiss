id: momentum_volatility_then_60d_nested

question: >
  Tillför negativt 60-dagars momentum ytterligare downside-risk
  efter att både negativt 5-dagars momentum och hög 20-dagars
  prisvolatilitet redan har identifierats?

mode: deep

signals:
  - name: price_momentum_5d
    direction: lower
    bins:
      - 0.20

  - name: price_volatility_20d
    direction: upper
    bins:
      - 0.20

  - name: price_momentum_60d
    direction: lower
    bins:
      - 0.20

targets:
  - down_5pct_5d
  - down_7pct_5d
  - down_10pct_5d

analysis:
  type: nested_regime_comparison
  bootstrap: true
  bootstrap_iterations: 2000

windows:
  - window_1
  - window_2

splits:
  - validation
  - test

metadata:
  stage: hypothesis_test
  purpose: nested_contribution

  baseline:
    definition: >
      negative_5d_momentum_20pct_and_high_20d_volatility_20pct

  incremental_signal:
    definition: negative_60d_momentum_20pct

  hypothesis:
    expected_effect: additional_downside_risk

  note: >
    Fristående discovery-test. Resultatet får inte användas för
    att ändra parametrar eller primärt endpoint i
    momentum_si_prospective_confirmation.
