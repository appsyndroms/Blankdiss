id: momentum_tail_threshold_analysis

question: >
  Kontrollerad analys av momentum-tailens tröskelstruktur
  för downside-risk.

mode: deep

signals:
  - name: price_momentum_5d
    direction: lower
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025

targets:
  - down_5pct_5d
  - down_7pct_5d
  - down_10pct_5d

analysis:
  type: tail
  bootstrap: true
  bootstrap_iterations: 2000

windows:
  - window_1
  - window_2

splits:
  - validation
  - test

metadata:
  stage: hypothesis_test
  purpose: momentum_tail_threshold_analysis

  ai_lab_execution:
    enabled: true
    mode: once
