id: momentum_incremental_si

question: >
  Tillför förändring i short interest information om 5-dagars
  downside-risk utöver 20-dagars momentum, och tillför
  kombinationen av momentum och short-interest-förändring
  ytterligare information?

mode: scan

signals:
  - name: price_momentum_20d
    direction: upper
    bins:
      - 0.20

  - name: short_interest_change
    direction: upper
    bins:
      - 0.20

targets:
  - down_5pct_5d
  - down_7pct_5d
  - down_10pct_5d

analysis:
  type: interaction
  bootstrap: false

windows:
  - window_1
  - window_2

splits:
  - validation
  - test

metadata:
  stage: hypothesis_test
  purpose: momentum_incremental_si

  baseline_model:
    definition: price_momentum_20d_tail

  incremental_model:
    definition: price_momentum_20d_tail_and_short_interest_change_tail

  interaction_model:
    definition: price_momentum_20d_tail_and_short_interest_change_tail

  baseline_signal: price_momentum_20d
  incremental_signal: short_interest_change

  interaction:
    signal_x: price_momentum_20d
    signal_y: short_interest_change

  evaluation:
    - event_rate
    - baseline_event_rate
    - lift
    - n_valid

  comparison:
    - baseline_event_rate
    - combined_event_rate
    - lift
    - combined_n

  note: >
    Den tidigare incremental_model-analysen är här uttryckt som
    deklarativ interaction i den nya researchmotorn. Baseline är
    20-dagars momentum-tail och combined är momentum-tail AND
    short-interest-change-tail. Ingen legacy analysis-type används.
