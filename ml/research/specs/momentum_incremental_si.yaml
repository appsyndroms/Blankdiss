id: momentum_si_regime_walk_forward

question: >
  Tillför förändring i short interest information om downside-risk
  inom negativa momentumregimer, trots att short-interest-förändring
  inte förbättrar den globala modellen?

mode: scan

signals:
  - name: price_momentum_5d
    direction: lower
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025

  - name: short_interest_change
    direction: upper
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025

targets:
  - down_5pct_5d
  - down_7pct_5d
  - down_10pct_5d

analysis:
  type: regime_comparison
  bootstrap: true
  confidence_level: 0.95

  baseline:
    signal: price_momentum_5d

  incremental:
    signal: short_interest_change

  comparison:
    - baseline_event_rate
    - combined_event_rate
    - absolute_event_rate_difference
    - lift
    - confidence_interval

windows:
  - window_1
  - window_2

splits:
  - validation
  - test

metadata:
  stage: hypothesis_test
  purpose: momentum_si_regime_walk_forward

  hypothesis:
    baseline: negative_5d_momentum
    incremental_signal: short_interest_change
    expected_effect: downside_risk_amplification

  evaluation:
    - event_rate
    - absolute_difference
    - lift
    - confidence_interval

  tails:
    momentum:
      direction: lower
      fractions:
        - 0.20
        - 0.10
        - 0.05
        - 0.025

    short_interest:
      direction: upper
      fractions:
        - 0.20
        - 0.10
        - 0.05
        - 0.025

  note: >
    2025 is test in window_1 and validation in window_2 and is therefore
    not an independent period across the two windows.
