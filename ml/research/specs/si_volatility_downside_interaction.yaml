id: si_volatility_downside_interaction

question: >
  Är hög förändring i short interest särskilt associerad med
  downside-risk när volatiliteten samtidigt är hög?

mode: scan

signals:
  - name: short_interest_change
    direction: upper
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025
      - 0.01

  - name: price_volatility_20d
    direction: upper
    bins:
      - 0.20
      - 0.10
      - 0.05
      - 0.025
      - 0.01

targets:
  - down_10pct_5d

analysis:
  type: interaction
  bootstrap: false

windows:
  - window_1
  - window_2

splits:
  - test

metadata:
  stage: migration
  source: ml/research/interaction_analysis.py
  purpose: generic_si_volatility_interaction
