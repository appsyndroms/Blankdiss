id: momentum_volatility_regime

question: >
  Tillför hög 20-dagars prisvolatilitet information om downside-risk
  inom de 20 procent mest negativa 5-dagars momentumobservationerna?

mode: deep

signals:
  - name: price_momentum_5d
    direction: lower
    bins:
      - 0.20

  - name: price_volatility_20d
    direction: upper
    bins:
      - 0.20

targets:
  - down_5pct_5d
  - down_7pct_5d
  - down_10pct_5d

analysis:
  type: regime_comparison
  bootstrap: true
  bootstrap_iterations: 2000

windows:
  - window_1
  - window_2

splits:
  - validation
  - test

metadata:
  stage: hypothesis_test
  purpose: momentum_volatility_regime

  ai_lab_execution:
    enabled: true
    mode: once

  hypothesis:
    baseline: negative_5d_momentum_20pct
    incremental_signal: high_20d_volatility_20pct
    expected_effect: additional_downside_risk

  comparison:
    baseline:
      definition: negative_5d_momentum_20pct

    combined:
      definition: negative_5d_momentum_20pct_and_high_20d_volatility_20pct

    primary_metric:
      name: absolute_event_rate_difference
      definition: combined_event_rate_minus_baseline_event_rate

    secondary_metrics:
      - lift
      - bootstrap_ci_low
      - bootstrap_ci_high

  note: >
    Detta är ett fristående discovery-test. Resultatet får inte
    användas för att ändra parametrar eller primärt endpoint i
    momentum_si_prospective_confirmation.
