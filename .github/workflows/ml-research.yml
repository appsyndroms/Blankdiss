name: Blankdiss Research
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  DISCOVERY_CONFIG: |
    enabled: true
    targets:
      - down_5pct_5d
      - down_7pct_5d
      - down_10pct_5d
    signals:
      - short_interest_change
      - short_interest_level
    stress_features:
      - price_volatility_20d
      - price_momentum_5d
      - price_momentum_20d
      - price_momentum_60d
      - distance_from_20d_high
      - distance_from_60d_high
    tails:
      - 0.20
      - 0.10
      - 0.05
      - 0.025
      - 0.01
    stress_directions:
      price_volatility_20d: upper
      price_momentum_5d: lower
      price_momentum_20d: lower
      price_momentum_60d: lower
      distance_from_20d_high: lower
      distance_from_60d_high: lower
    validation:
      min_rows_per_window: 20
      min_positive_windows: 2
      min_lift: 1.10
      max_return_difference: 0.0
      max_findings: 25
concurrency:
  group: research-manual
  cancel-in-progress: false
jobs:
  research:
    name: Kör Blankdiss Research Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Clean latest research results
        run: |
          mkdir -p data/processed/ml/research/latest/diagnostic
          find data/processed/ml/research/latest -type f -delete
      - name: Fetch FI aggregate
        run: |
          python -u -m fi
      - name: Fetch prices
        run: |
          python -m prices --start 2022-01-01
      - name: Check whether features need rebuilding
        run: |
          python -u -m analysis.feature_source_check
      - name: Build features
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -u -m analysis.build_features
      - name: Inspect feature dataset
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -m analysis.ci inspect-features
      - name: Verify feature dataset
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -m analysis.ci verify-features
      - name: Run Feature QC
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -u -m analysis.features_qc
      - name: Verify Feature QC
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -m analysis.ci verify-feature-qc
      - name: Verify feature dataset exists
        run: |
          test -f data/processed/analysis/features_metadata.json
          test -n "$(
            find data/processed/analysis \
              -maxdepth 1 \
              -type f \
              -name 'features_*.jsonl' \
              -print \
              -quit
          )"
      - name: Run Research Matrix
        run: |
          python -u -m ml.research.runner
      - name: Run Registered Experiments
        run: |
          python -u -m ml.experiment_registry_runner
      - name: Run Discovery
        run: |
          python -u -m ml.research.discovery.runner
      - name: Verify research results
        run: |
          test -f data/processed/ml/research/latest/results.jsonl
          test -f data/processed/ml/research/latest/pooled.json
          test -f data/processed/ml/research/latest/metadata.json
          test -f data/processed/ml/research/latest/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path(
              "data/processed/ml/research/latest"
          )
          results_path = base / "results.jsonl"
          pooled_path = base / "pooled.json"
          metadata_path = base / "metadata.json"
          report_path = base / "report.md"
          result_count = sum(
              1
              for line in results_path.open(
                  encoding="utf-8"
              )
              if line.strip()
          )
          if result_count == 0:
              raise SystemExit(
                  "Research results innehåller inga resultat."
              )
          pooled = json.loads(
              pooled_path.read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(pooled, list):
              raise SystemExit(
                  "Pooled research results är inte en lista."
              )
          if len(pooled) == 0:
              raise SystemExit(
                  "Pooled research results innehåller inga experiment."
              )
          metadata = json.loads(
              metadata_path.read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(metadata, dict):
              raise SystemExit(
                  "Research metadata är inte ett objekt."
              )
          report = report_path.read_text(
              encoding="utf-8"
          )
          if not report.strip():
              raise SystemExit(
                  "Research report är tom."
              )
          print(
              "Research results:",
              result_count,
          )
          print(
              "Pooled experiments:",
              len(pooled),
          )
          print(
              "Report:",
              report_path,
          )
          PY
      - name: Verify discovery results
        run: |
          test -f data/processed/ml/research/discovery/latest/results.jsonl
          test -f data/processed/ml/research/discovery/latest/pooled.json
          test -f data/processed/ml/research/discovery/latest/findings.json
          test -f data/processed/ml/research/discovery/latest/metadata.json
          test -f data/processed/ml/research/discovery/latest/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path(
              "data/processed/ml/research/discovery/latest"
          )
          results_path = base / "results.jsonl"
          pooled_path = base / "pooled.json"
          findings_path = base / "findings.json"
          metadata_path = base / "metadata.json"
          report_path = base / "report.md"
          result_count = sum(
              1
              for line in results_path.open(
                  encoding="utf-8"
              )
              if line.strip()
          )
          if result_count == 0:
              raise SystemExit(
                  "Discovery results innehåller inga resultat."
              )
          pooled = json.loads(
              pooled_path.read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(pooled, list):
              raise SystemExit(
                  "Discovery pooled results är inte en lista."
              )
          if len(pooled) == 0:
              raise SystemExit(
                  "Discovery pooled results innehåller inga kandidater."
              )
          findings = json.loads(
              findings_path.read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(findings, list):
              raise SystemExit(
                  "Discovery findings är inte en lista."
              )
          metadata = json.loads(
              metadata_path.read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(metadata, dict):
              raise SystemExit(
                  "Discovery metadata är inte ett objekt."
              )
          expected_candidates = 900
          actual_candidates = metadata.get(
              "candidate_count"
          )
          if actual_candidates != expected_candidates:
              raise SystemExit(
                  "Fel antal discovery-kandidater: "
                  f"{actual_candidates}; "
                  f"förväntade {expected_candidates}."
              )
          expected_oos_results = (
              expected_candidates
              * len(
                  metadata.get(
                      "walk_forward_windows",
                      [],
                  )
              )
          )
          if result_count != expected_oos_results:
              raise SystemExit(
                  "Fel antal Discovery OOS-resultat: "
                  f"{result_count}; "
                  f"förväntade {expected_oos_results}."
              )
          report = report_path.read_text(
              encoding="utf-8"
          )
          if not report.strip():
              raise SystemExit(
                  "Discovery report är tom."
              )
          print(
              "Discovery results:",
              result_count,
          )
          print(
              "Discovery pooled candidates:",
              len(pooled),
          )
          print(
              "Discovery findings:",
              len(findings),
          )
          print(
              "Discovery candidates:",
              actual_candidates,
          )
          print(
              "Discovery expected OOS results:",
              expected_oos_results,
          )
          print(
              "Discovery report:",
              report_path,
          )
          PY
      - name: Verify diagnostic results
        run: |
          python -m ml.diagnostics.verify
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-research
          path: |
            data/processed/ml/research/latest/results.jsonl
            data/processed/ml/research/latest/pooled.json
            data/processed/ml/research/latest/metadata.json
            data/processed/ml/research/latest/report.md
            data/processed/ml/research/latest/diagnostics.json
            data/processed/ml/research/latest/diagnostic/*.json
            data/processed/ml/research/*/results.jsonl
            data/processed/ml/research/*/pooled.json
            data/processed/ml/research/*/metadata.json
            data/processed/ml/research/*/report.md
            data/processed/ml/research/*/diagnostics.json
            data/processed/ml/research/*/diagnostic/*.json
            data/processed/ml/research/discovery/latest/results.jsonl
            data/processed/ml/research/discovery/latest/pooled.json
            data/processed/ml/research/discovery/latest/findings.json
            data/processed/ml/research/discovery/latest/metadata.json
            data/processed/ml/research/discovery/latest/report.md
            data/processed/ml/research/discovery/*/results.jsonl
            data/processed/ml/research/discovery/*/pooled.json
            data/processed/ml/research/discovery/*/findings.json
            data/processed/ml/research/discovery/*/metadata.json
            data/processed/ml/research/discovery/*/report.md
          if-no-files-found: error
      - name: Persist research and discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/ml/research/latest/diagnostics.json \
            data/processed/ml/research/latest/diagnostic/*.json \
            data/processed/analysis/features_*.jsonl \
            data/processed/analysis/features_metadata.json \
            data/processed/ml/research/discovery/latest/results.jsonl \
            data/processed/ml/research/discovery/latest/pooled.json \
            data/processed/ml/research/discovery/latest/findings.json \
            data/processed/ml/research/discovery/latest/metadata.json \
            data/processed/ml/research/discovery/latest/report.md \
            data/processed/ml/research/discovery/*/results.jsonl \
            data/processed/ml/research/discovery/*/pooled.json \
            data/processed/ml/research/discovery/*/findings.json \
            data/processed/ml/research/discovery/*/metadata.json \
            data/processed/ml/research/discovery/*/report.md
          if git diff --cached --quiet; then
            echo "Inga forsknings- eller discovery-resultat ändrades."
          else
            git commit -m "Update research and discovery results"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Kunde inte pusha forskningsresultaten efter 3 försök."
                exit 1
              fi
              echo "Push misslyckades. Hämtar senaste main och försöker igen."
              git fetch origin main
              git rebase origin/main
            done
          fi
