name: ML Research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Discovery
        run: |
          python -u -m ml.research.discovery.runner

      - name: Run Momentum × SI Surface Analysis
        run: |
          python -u -m ml.research.momentum_si_surface_analysis

      - name: Run Momentum × SI Surface Stability Analysis
        run: |
          python -u -m ml.research.momentum_si_surface_stability_analysis

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-research-${{ github.run_id }}
          path: |
            data/processed/ml/research/discovery/**
            data/processed/ml/research/momentum_si_surface/**
            data/processed/ml/research/momentum_si_surface_stability/**
          if-no-files-found: warn

      - name: Commit research results
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/ml/research/discovery \
            data/processed/ml/research/momentum_si_surface \
            data/processed/ml/research/momentum_si_surface_stability

          if git diff --cached --quiet; then
            echo "No research result changes to commit."
          else
            git commit -m "Update ML research results"
            git push
          fi
