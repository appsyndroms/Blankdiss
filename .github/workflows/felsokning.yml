name: Felsökning
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Vilken felsökning ska köras?"
        required: true
        type: choice
        options:
          - yahoo_price
          - identity
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Yahoo price diagnostic
        if: ${{ inputs.diagnostic == 'yahoo_price' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python felsokning/debug_yahoo_price.py
      - name: Run identity diagnostic
        if: ${{ inputs.diagnostic == 'identity' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python felsokning/debug_identity.py
