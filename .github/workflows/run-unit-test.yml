name: run-unit-test

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/analysis/test_forward_return_identity.py"
      - "tests/analysis/test_forward_return_alignment_diagnostic.py"
      - "analysis/**"
      - "data/raw/prices/**"
      - "data/processed/analysis/**"
      - ".github/workflows/run-unit-test.yml"

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forward return identity tests
        run: |
          python -m pytest \
            tests/analysis/test_forward_return_identity.py \
            tests/analysis/test_forward_return_alignment_diagnostic.py \
            -v -s
