name: Undersök FI backend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Kartlägg FI:s backend för blankningsregistret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      - name: Kör FI backend-probe
        env:
          TZ: Europe/Stockholm
        run: |
          python - <<'PY'
          from __future__ import annotations
          import re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          BASE_URL = "https://www.fi.se"
          PAGE_URL = (
              "https://www.fi.se/"
              "sv/vara-register/"
              "blankningsregistret/"
          )
          AGGREGATE_PATH = (
              "/BlankningsRegister/"
              "GetBlankningsregisterAggregat"
          )
          HISTORICAL_PATH = (
              "/BlankningsRegister/"
              "GetHistFile"
          )
          CURRENT_PATH = (
              "/BlankningsRegister/"
              "GetAktuellFile"
          )
          REPORT = Path("fi-backend-probe.txt")
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; Blankdiss/1.0)"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,*/*;q=0.8"
              ),
          }
          session = requests.Session()
          session.headers.update(HEADERS)
          def section(report, title):
              report.write("\n")
              report.write("=" * 80 + "\n")
              report.write(title + "\n")
              report.write("=" * 80 + "\n")
          def line(report, text=""):
              print(text)
              report.write(text + "\n")
          def response_info(response):
              content_type = response.headers.get(
                  "Content-Type",
                  "",
              )
              content_disposition = response.headers.get(
                  "Content-Disposition",
                  "",
              )
              return (
                  f"HTTP={response.status_code}; "
                  f"Content-Type={content_type}; "
                  f"Length={len(response.content)}; "
                  f"Disposition={content_disposition}"
              )
          def extract_endpoint_strings(text):
              patterns = [
                  r'["\']([^"\']*BlankningsRegister[^"\']*)["\']',
                  r'["\']([^"\']*/Get[A-Za-z0-9_]+)["\']',
                  r'url\s*:\s*["\']([^"\']+)["\']',
                  r'fetch\s*\(\s*["\']([^"\']+)["\']',
                  r'\$\.ajax\s*\(\s*\{[^}]*url\s*:\s*["\']([^"\']+)["\']',
                  r'\$\.get\s*\(\s*["\']([^"\']+)["\']',
                  r'\$\.post\s*\(\s*["\']([^"\']+)["\']',
              ]
              found = set()
              for pattern in patterns:
                  for match in re.findall(
                      pattern,
                      text,
                      flags=re.IGNORECASE | re.DOTALL,
                  ):
                      if isinstance(match, tuple):
                          value = match[0]
                      else:
                          value = match
                      value = value.strip()
                      if value:
                          found.add(value)
              return sorted(found)
          def normalize_url(value):
              if value.startswith("http://"):
                  return value
              if value.startswith("https://"):
                  return value
              return urljoin(BASE_URL, value)
          with REPORT.open(
              "w",
              encoding="utf-8",
          ) as report:
              section(
                  report,
                  "FI BACKEND-PROBE",
              )
              line(
                  report,
                  f"Sida: {PAGE_URL}",
              )
              line(
                  report,
                  f"Aggregate: {BASE_URL}{AGGREGATE_PATH}",
              )
              line(
                  report,
                  f"Historical: {BASE_URL}{HISTORICAL_PATH}",
              )
              line(
                  report,
                  f"Current: {BASE_URL}{CURRENT_PATH}",
              )
              # ----------------------------------------------------------
              # 1. Hämta huvudsidan
              # ----------------------------------------------------------
              section(
                  report,
                  "1. HUVUDSIDA",
              )
              page_response = session.get(
                  PAGE_URL,
                  timeout=60,
              )
              line(
                  report,
                  response_info(page_response),
              )
              page_response.raise_for_status()
              html = page_response.text
              line(
                  report,
                  f"HTML-bytes: {len(page_response.content)}",
              )
              # ----------------------------------------------------------
              # 2. Inline JavaScript
              # ----------------------------------------------------------
              section(
                  report,
                  "2. INLINE JAVASCRIPT",
              )
              soup = BeautifulSoup(
                  html,
                  "html.parser",
              )
              inline_scripts = []
              for script in soup.find_all("script"):
                  if script.get("src"):
                      continue
                  text = script.get_text(
                      "\n",
                  ).strip()
                  if text:
                      inline_scripts.append(text)
              line(
                  report,
                  f"Antal inline-script: {len(inline_scripts)}",
              )
              inline_text = "\n\n".join(
                  inline_scripts,
              )
              endpoints = extract_endpoint_strings(
                  inline_text,
              )
              line(
                  report,
                  "Endpoint-liknande strängar:",
              )
              for endpoint in endpoints:
                  line(
                      report,
                      f"- {endpoint}",
                  )
              if "GetBlankningsregisterAggregat" in inline_text:
                  line(
                      report,
                      "",
                  )
                  line(
                      report,
                      "HITTAT: "
                      "GetBlankningsregisterAggregat",
                  )
              # ----------------------------------------------------------
              # 3. Externa JavaScript-filer
              # ----------------------------------------------------------
              section(
                  report,
                  "3. EXTERNA JAVASCRIPT-FILER",
              )
              script_urls = []
              for script in soup.find_all(
                  "script",
                  src=True,
              ):
                  src = script.get("src")
                  if not src:
                      continue
                  script_url = normalize_url(src)
                  if script_url not in script_urls:
                      script_urls.append(
                          script_url
                      )
              line(
                  report,
                  f"Antal externa script: "
                  f"{len(script_urls)}",
              )
              external_hits = {}
              for script_url in script_urls:
                  try:
                      response = session.get(
                          script_url,
                          timeout=30,
                      )
                      if response.status_code != 200:
                          continue
                      text = response.text
                      hits = extract_endpoint_strings(
                          text,
                      )
                      relevant = []
                      for hit in hits:
                          lowered = hit.lower()
                          if (
                              "blankning" in lowered
                              or "position" in lowered
                              or "aggregate" in lowered
                              or "aggregat" in lowered
                          ):
                              relevant.append(hit)
                      if (
                          "GetBlankningsregisterAggregat"
                          in text
                      ):
                          relevant.append(
                              "GetBlankningsregisterAggregat"
                          )
                      if relevant:
                          external_hits[
                              script_url
                          ] = sorted(
                              set(relevant)
                          )
                  except Exception as exc:
                      line(
                          report,
                          f"Scriptfel {script_url}: "
                          f"{type(exc).__name__}: {exc}",
                      )
              if external_hits:
                  for script_url, hits in (
                      external_hits.items()
                  ):
                      line(
                          report,
                          "",
                      )
                      line(
                          report,
                          f"SCRIPT: {script_url}",
                      )
                      for hit in hits:
                          line(
                              report,
                              f"  - {hit}",
                          )
              else:
                  line(
                      report,
                      "Inga relevanta endpoint-träffar "
                      "i externa script.",
                  )
              # ----------------------------------------------------------
              # 4. Visa kontext runt aggregate-anropet
              # ----------------------------------------------------------
              section(
                  report,
                  "4. KONTEXT RUNT AGGREGATE-ANROPET",
              )
              match = re.search(
                  r".{0,1200}"
                  r"GetBlankningsregisterAggregat"
                  r".{0,1200}",
                  inline_text,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              if match:
                  context = match.group(0)
                  line(
                      report,
                      context,
                  )
              else:
                  line(
                      report,
                      "Ingen inline-kontext hittades.",
                  )
              # ----------------------------------------------------------
              # 5. Baseline: dagens aggregate
              # ----------------------------------------------------------
              section(
                  report,
                  "5. BASELINE AGGREGATE",
              )
              aggregate_url = (
                  BASE_URL + AGGREGATE_PATH
              )
              aggregate_response = session.get(
                  aggregate_url,
                  timeout=60,
              )
              line(
                  report,
                  f"URL: {aggregate_url}",
              )
              line(
                  report,
                  response_info(
                      aggregate_response
                  ),
              )
              aggregate_response.raise_for_status()
              aggregate_bytes = (
                  aggregate_response.content
              )
              Path(
                  "aggregate-baseline.ods"
              ).write_bytes(
                  aggregate_bytes
              )
              # ----------------------------------------------------------
              # 6. Testa försiktigt datumparametrar
              # ----------------------------------------------------------
              section(
                  report,
                  "6. DATUMPARAMETER-PROBE",
              )
              test_date = "2026-08-01"
              parameter_names = [
                  "date",
                  "datum",
                  "from",
                  "to",
                  "startDate",
                  "endDate",
                  "start",
                  "end",
                  "dateFrom",
                  "dateTo",
                  "positionsdatum",
                  "positionDate",
                  "asOfDate",
                  "historicalDate",
              ]
              tested = set()
              for name in parameter_names:
                  params = {
                      name: test_date
                  }
                  try:
                      response = session.get(
                          aggregate_url,
                          params=params,
                          timeout=30,
                      )
                      final_url = response.url
                      signature = (
                          response.status_code,
                          response.headers.get(
                              "Content-Type",
                              "",
                          ),
                          len(response.content),
                      )
                      changed = (
                          response.content
                          != aggregate_bytes
                      )
                      key = (
                          name,
                          signature,
                          changed,
                      )
                      if key in tested:
                          continue
                      tested.add(key)
                      line(
                          report,
                          f"GET {name}={test_date}: "
                          f"{response_info(response)}; "
                          f"changed={changed}",
                      )
                      if (
                          final_url
                          != aggregate_url
                      ):
                          line(
                              report,
                              f"  Final URL: {final_url}",
                          )
                  except Exception as exc:
                      line(
                          report,
                          f"GET {name}: "
                          f"{type(exc).__name__}: {exc}",
                      )
              # ----------------------------------------------------------
              # 7. POST-probe
              # ----------------------------------------------------------
              section(
                  report,
                  "7. POST-DATUMPARAMETER-PROBE",
              )
              post_parameter_names = [
                  "date",
                  "datum",
                  "from",
                  "to",
                  "startDate",
                  "endDate",
                  "start",
                  "end",
                  "dateFrom",
                  "dateTo",
                  "positionsdatum",
                  "positionDate",
                  "asOfDate",
                  "historicalDate",
              ]
              for name in post_parameter_names:
                  payload = {
                      name: test_date
                  }
                  try:
                      response = session.post(
                          aggregate_url,
                          data=payload,
                          timeout=30,
                      )
                      changed = (
                          response.content
                          != aggregate_bytes
                      )
                      line(
                          report,
                          f"POST {name}={test_date}: "
                          f"{response_info(response)}; "
                          f"changed={changed}",
                      )
                      location = response.headers.get(
                          "Location"
                      )
                      if location:
                          line(
                              report,
                              f"  Location: {location}",
                          )
                  except Exception as exc:
                      line(
                          report,
                          f"POST {name}: "
                          f"{type(exc).__name__}: {exc}",
                      )
              # ----------------------------------------------------------
              # 8. Testa flera möjliga controller-rutter
              # ----------------------------------------------------------
              section(
                  report,
                  "8. MÖJLIGA HISTORISKA ROUTES",
              )
              route_candidates = [
                  "/BlankningsRegister/"
                  "GetHistoriskaBlankningsregisterAggregat",
                  "/BlankningsRegister/"
                  "GetHistoricalBlankningsregisterAggregat",
                  "/BlankningsRegister/"
                  "GetHistoriskaAggregat",
                  "/BlankningsRegister/"
                  "GetHistoricalAggregat",
                  "/BlankningsRegister/"
                  "GetBlankningsregisterAggregatHistorik",
                  "/BlankningsRegister/"
                  "GetBlankningsregisterAggregatHistorical",
                  "/BlankningsRegister/"
                  "GetHistAggregat",
                  "/BlankningsRegister/"
                  "GetHistoricalAggregate",
                  "/BlankningsRegister/"
                  "GetAggregateHistory",
                  "/BlankningsRegister/"
                  "GetAggregatHistorik",
                  "/BlankningsRegister/"
                  "GetAggregatedHistory",
              ]
              for path in route_candidates:
                  url = BASE_URL + path
                  try:
                      response = session.get(
                          url,
                          timeout=20,
                      )
                      line(
                          report,
                          f"{path}: "
                          f"{response_info(response)}",
                      )
                      if response.status_code == 200:
                          content_type = (
                              response.headers.get(
                                  "Content-Type",
                                  "",
                              )
                          )
                          if (
                              "spreadsheet"
                              in content_type.lower()
                              or "excel"
                              in content_type.lower()
                              or len(response.content)
                              > 10000
                          ):
                              output_name = (
                                  "candidate-"
                                  + str(
                                      len(
                                          list(
                                              Path(".").glob(
                                                  "candidate-*"
                                              )
                                          )
                                      )
                                  )
                                  + ".bin"
                              )
                              Path(
                                  output_name
                              ).write_bytes(
                                  response.content
                              )
                              line(
                                  report,
                                  f"  POTENTIELL DATAFIL: "
                                  f"{output_name}",
                              )
                  except Exception as exc:
                      line(
                          report,
                          f"{path}: "
                          f"{type(exc).__name__}: {exc}",
                      )
              # ----------------------------------------------------------
              # 9. Leta efter formulär / hidden fields
              # ----------------------------------------------------------
              section(
                  report,
                  "9. FORMULÄR OCH HIDDEN FIELDS",
              )
              forms = soup.find_all("form")
              line(
                  report,
                  f"Antal formulär: {len(forms)}",
              )
              for index, form in enumerate(forms):
                  line(
                      report,
                      f"FORM {index}",
                  )
                  line(
                      report,
                      f"  action="
                      f"{form.get('action')}",
                  )
                  line(
                      report,
                      f"  method="
                      f"{form.get('method')}",
                  )
                  for field in form.find_all(
                      ["input", "select", "button"]
                  ):
                      name = field.get("name")
                      value = field.get("value")
                      field_type = field.get("type")
                      if (
                          name
                          or value
                          or field_type
                      ):
                          line(
                              report,
                              "  FIELD "
                              f"name={name!r} "
                              f"type={field_type!r} "
                              f"value={value!r}",
                          )
              # ----------------------------------------------------------
              # 10. Sammanfattning
              # ----------------------------------------------------------
              section(
                  report,
                  "10. SLUTSATS",
              )
              line(
                  report,
                  "Probe genomförd.",
              )
              line(
                  report,
                  "",
              )
              line(
                  report,
                  "VIKTIGT:",
              )
              line(
                  report,
                  "En parameter räknas inte som fungerande "
                  "bara för att HTTP 200 returneras.",
              )
              line(
                  report,
                  "Vi måste jämföra Content-Type, "
                  "storlek och bytesinnehåll.",
              )
              line(
                  report,
                  "",
              )
              line(
                  report,
                  "Baseline aggregate sparad som "
                  "aggregate-baseline.ods",
              )
          print()
          print("=" * 80)
          print("PROBE KLAR")
          print("=" * 80)
          print(
              "Rapport:",
              REPORT,
          )
          PY
      - name: Visa kort rapport i GitHub Actions
        run: |
          {
            echo "## FI backend-probe"
            echo
            echo '### Viktiga fynd'
            echo
            grep -E \
              "HITTAT:|GET .*changed=|POST .*changed=|POTENTIELL DATAFIL|GetBlankningsregisterAggregat" \
              fi-backend-probe.txt \
              | head -n 100 \
              || true
            echo
            echo "Fullständig rapport finns i artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ladda upp probe-resultat
        uses: actions/upload-artifact@v4
        with:
          name: fi-backend-probe
          path: |
            fi-backend-probe.txt
            aggregate-baseline.ods
            candidate-*
          if-no-files-found: error
          retention-days: 14
