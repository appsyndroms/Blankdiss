name: ML Benchmark
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run short-interest event-risk interaction diagnostic
        run: |
          python -u -m ml.diagnostics.fi_short_interest_event_risk_interaction_diagnostic
