name: ML Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run volatility price control screening
        run: python -u -m ml.diagnostics.volatility_price_control_screening

      # Tidigare screeningar pausade medan volatility-signalen
      # undersöks närmare.
