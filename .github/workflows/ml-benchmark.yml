name: ML Benchmark
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Verify FI direction diagnostics
        run: |
          grep -n "find_price_files" ml/diagnostics/fi_direction_bootstrap_diagnostic.py
          grep -n "from analysis.feature_config import PRICE_DIR" ml/diagnostics/fi_direction_bootstrap_diagnostic.py
          grep -n "short_interest_pct" ml/diagnostics/fi_direction_conditional_diagnostic.py
          grep -n "bootstrap_down_rate_difference" ml/diagnostics/fi_direction_conditional_diagnostic.py
      - name: Run FI direction bootstrap benchmark
        run: |
          python -u -m ml.diagnostics.fi_direction_bootstrap_diagnostic
      - name: Run conditional FI direction benchmark
        run: |
          python -u -m ml.diagnostics.fi_direction_conditional_diagnostic
