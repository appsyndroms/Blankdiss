name: ML Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ML benchmark
        run: python -u -m ml.benchmark

      - name: Run volatility diagnostics
        run: python -u -m ml.volatility_diagnostics

      - name: Run volatility interaction screening
        run: python -u -m ml.volatility_interaction_screening
