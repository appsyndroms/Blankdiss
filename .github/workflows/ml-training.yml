name: Blankdiss ML Training
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Features - build och QC"
    types:
      - completed
permissions:
  contents: read
  actions: read
jobs:
  train-ml:
    name: Träna Blankdiss ML
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify feature dataset
        run: |
          test -f data/processed/analysis/features.jsonl
          test -f data/processed/analysis/features_metadata.json
          echo "Feature-dataset finns."
          echo
          echo "Filer:"
          ls -lh data/processed/analysis/features.jsonl
          ls -lh data/processed/analysis/features_metadata.json
      - name: Verify ML package
        run: |
          test -f __init__.py
          test -f ml/__init__.py
          test -f ml/config.py
          test -f ml/dataset.py
          test -f ml/models.py
          test -f ml/evaluate.py
          test -f ml/walk_forward.py
          test -f ml/train.py
          test -f ml/diagnostics.py
          echo "ML-paket finns."
      - name: Run ML training
        run: |
          python -m ml.train
      - name: Verify ML results
        run: |
          test -f data/processed/ml/latest_run.json
          test -f data/processed/ml/ml_results.jsonl
          test -d data/processed/ml/runs
          echo "ML-resultat skapade."
          echo
          echo "Resultat:"
          ls -lh data/processed/ml/
          echo
          echo "Runs:"
          ls -lh data/processed/ml/runs/
      - name: Run ML diagnostics
        run: |
          python -m ml.diagnostics
      - name: Verify ML diagnostics
        run: |
          test -f data/processed/ml/diagnostics.json
          echo "ML-diagnostik skapad."
          echo
          echo "Diagnostics:"
          ls -lh data/processed/ml/diagnostics.json
      - name: Print ML diagnostics summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(
              "data/processed/ml/diagnostics.json"
          )
          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )
          print()
          print("================================")
          print("BLANKDISS PRICE SIGNAL DIAGNOSTICS")
          print("================================")
          print(
              f"Experiment: "
              f"{data.get('experiment', '?')}"
          )
          print(
              f"Feature sets: "
              f"{', '.join(data.get('feature_sets', []))}"
          )
          print(
              f"Targets: "
              f"{', '.join(data.get('targets', []))}"
          )
          print()
          for result in data.get(
              "results",
              [],
          ):
              print("--------------------------------")
              print(
                  f"Feature set: "
                  f"{result.get('feature_set', '?')}"
              )
              print(
                  f"Target: "
                  f"{result.get('target', '?')}"
              )
              print(
                  f"Features: "
                  f"{result.get('feature_count', '?')}"
              )
              summary = result.get(
                  "dataset_summary",
                  {},
              )
              print(
                  f"Rows: "
                  f"{summary.get('rows', '?')}"
              )
              print(
                  f"Baseline event rate: "
                  f"{summary.get('positive_rate', '?')}"
              )
              print(
                  f"Date range: "
                  f"{summary.get('date_start', '?')} "
                  f"-> "
                  f"{summary.get('date_end', '?')}"
              )
              print()
              for window in result.get(
                  "windows",
                  [],
              ):
                  window_info = window.get(
                      "window",
                      {},
                  )
                  print(
                      "Window: "
                      f"{window_info.get('train_end', '?')} "
                      "-> "
                      f"{window_info.get('validation_end', '?')} "
                      "-> "
                      f"{window_info.get('test_end', '?')}"
                  )
                  print(
                      "Selected model: "
                      f"{window.get('selected_model', '?')}"
                  )
                  print(
                      "Validation AUC: "
                      f"{window.get('validation_roc_auc', '?')}"
                  )
                  print(
                      "Test AUC: "
                      f"{window.get('test_roc_auc', '?')}"
                  )
                  print(
                      "Test rows: "
                      f"{window.get('test_rows', '?')}"
                  )
                  print(
                      "Test event rate: "
                      f"{window.get('test_positive_rate', '?')}"
                  )
                  print()
                  print("Prediction buckets:")
                  prediction_buckets = window.get(
                      "prediction_buckets",
                      {},
                  )
                  for year, bucket_data in prediction_buckets.items():
                      print(
                          f"  {year}: "
                          f"baseline="
                          f"{bucket_data.get('baseline_event_rate', '?')}"
                      )
                      for bucket in bucket_data.get(
                          "buckets",
                          [],
                      ):
                          fraction = (
                              bucket.get(
                                  "top_fraction",
                                  0,
                              )
                              * 100
                          )
                          event_rate = bucket.get(
                              "event_rate",
                              0,
                          )
                          lift_ratio = bucket.get(
                              "event_rate_lift_ratio"
                          )
                          mean_return = bucket.get(
                              "mean_return"
                          )
                          median_return = bucket.get(
                              "median_return"
                          )
                          print(
                              f"    Top {fraction:.0f}%: "
                              f"event_rate={event_rate:.4f}, "
                              f"lift_ratio={lift_ratio}, "
                              f"mean_return={mean_return}, "
                              f"median_return={median_return}"
                          )
                  print()
                  print("Top features:")
                  for feature in window.get(
                      "feature_importance",
                      [],
                  )[:10]:
                      importance = feature.get(
                          "importance"
                      )
                      if importance is None:
                          importance = feature.get(
                              "importance_mean"
                          )
                      print(
                          "  "
                          f"{feature.get('feature', '?')}: "
                          f"{importance if importance is not None else '?'}"
                      )
                  print()
      - name: Print latest ML result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(
              "data/processed/ml/latest_run.json"
          )
          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )
          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-training-results
          path: |
            data/processed/ml/latest_run.json
            data/processed/ml/ml_results.jsonl
            data/processed/ml/diagnostics.json
            data/processed/ml/runs/*.json
          if-no-files-found: error
