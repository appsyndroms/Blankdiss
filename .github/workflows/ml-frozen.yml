name: ML Frozen Research

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DISCOVERY_CONFIG: |
    enabled: true
    discovery_end_date: "2025-12-19"
    targets:
      - down_10pct_5d
    signals:
      - short_interest_change
    stress_features:
      - price_volatility_20d
    tails:
      - 0.01
      - 0.025
      - 0.05
      - 0.10
    stress_directions:
      price_volatility_20d: upper
    validation:
      min_rows_per_window: 20
      min_positive_windows: 2
      min_lift: 1.10
      max_return_difference: 0.0
      max_findings: 25

jobs:
  frozen-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run frozen discovery
        env:
          DISCOVERY_CONFIG: ${{ env.DISCOVERY_CONFIG }}
        run: |
          python -m ml.research.discovery.runner

      - name: Run frozen interaction analysis
        run: |
          python -m ml.research.interaction_analysis

      - name: Verify frozen research outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          discovery_root = Path(
              "data/processed/ml/research/discovery"
          )

          frozen_root = Path(
              "data/processed/ml/research/frozen"
          )

          discovery_metadata = (
              discovery_root / "latest" / "metadata.json"
          )

          if not discovery_metadata.exists():
              raise SystemExit(
                  f"Missing discovery metadata: "
                  f"{discovery_metadata}"
              )

          with discovery_metadata.open() as f:
              discovery = json.load(f)

          assert discovery["targets"] == [
              "down_10pct_5d"
          ]

          assert discovery["signals"] == [
              "short_interest_change"
          ]

          assert discovery["stress_features"] == [
              "price_volatility_20d"
          ]

          assert discovery["tails"] == [
              0.01,
              0.025,
              0.05,
              0.1,
          ]

          assert (
              discovery["stress_directions"][
                  "price_volatility_20d"
              ]
              == "upper"
          )

          assert (
              discovery["feature_rows"] > 0
          )

          assert (
              discovery["candidate_count"] == 16
          )

          assert (
              discovery["result_count"] == 32
          )

          assert (
              discovery["pooled_count"] == 16
          )

          windows = discovery["walk_forward_windows"]

          assert len(windows) == 2

          print(
              "Discovery verification passed."
          )

          print(
              f"Feature rows: "
              f"{discovery['feature_rows']}"
          )

          print(
              f"Candidates: "
              f"{discovery['candidate_count']}"
          )

          print(
              f"Results: "
              f"{discovery['result_count']}"
          )

          print(
              f"Pooled: "
              f"{discovery['pooled_count']}"
          )

          # Verify that at least one frozen metadata
          # file contains the expected discovery end date.
          matching_frozen_metadata = []

          for path in frozen_root.rglob(
              "metadata.json"
          ):
              try:
                  with path.open() as f:
                      metadata = json.load(f)
              except Exception:
                  continue

              if (
                  metadata.get(
                      "discovery_end_date"
                  )
                  == "2025-12-19"
              ):
                  matching_frozen_metadata.append(
                      path
                  )

          if not matching_frozen_metadata:
              raise SystemExit(
                  "No frozen metadata with "
                  "discovery_end_date=2025-12-19 "
                  "was found."
              )

          print(
              "Frozen metadata verification passed."
          )

          for path in matching_frozen_metadata:
              print(
                  f"Verified frozen metadata: {path}"
              )
          PY

      - name: Verify interaction outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "data/processed/ml/research/interaction"
          )

          required = [
              root / "results.json",
              root / "results.csv",
              root / "interactions.csv",
          ]

          for path in required:
              if not path.exists():
                  raise SystemExit(
                      f"Missing interaction output: {path}"
                  )

          results_json = root / "results.json"

          with results_json.open() as f:
              data = json.load(f)

          # --------------------------------------------------
          # Core metadata
          # --------------------------------------------------

          assert (
              data["target"]
              == "down_10pct_5d"
          )

          assert (
              data["discovery_end"]
              == "2025-12-19"
          )

          assert (
              data["rows"] > 0
          )

          results = data["results"]

          # --------------------------------------------------
          # Expected tails
          # --------------------------------------------------

          expected_tails = [
              0.01,
              0.025,
              0.05,
              0.1,
          ]

          expected_pairs = {
              (si_tail, vol_tail)
              for si_tail in expected_tails
              for vol_tail in expected_tails
          }

          # --------------------------------------------------
          # 4 SI-only rows
          # --------------------------------------------------

          si_only = [
              r
              for r in results
              if r.get("analysis") == "si_only"
          ]

          assert len(si_only) == 4, (
              f"Expected 4 SI-only rows, "
              f"got {len(si_only)}"
          )

          assert sorted(
              r["si_tail"]
              for r in si_only
          ) == expected_tails

          # --------------------------------------------------
          # 4 volatility-only rows
          # --------------------------------------------------

          vol_only = [
              r
              for r in results
              if r.get("analysis")
              == "volatility_only"
          ]

          assert len(vol_only) == 4, (
              f"Expected 4 volatility-only rows, "
              f"got {len(vol_only)}"
          )

          assert sorted(
              r["vol_tail"]
              for r in vol_only
          ) == expected_tails

          # --------------------------------------------------
          # 16 SI × volatility rows
          # --------------------------------------------------

          interaction_rows = [
              r
              for r in results
              if r.get("analysis")
              == "interaction"
          ]

          assert len(interaction_rows) == 16, (
              f"Expected 16 SI×VOL rows, "
              f"got {len(interaction_rows)}"
          )

          actual_pairs = {
              (
                  r["si_tail"],
                  r["vol_tail"],
              )
              for r in interaction_rows
          }

          assert actual_pairs == expected_pairs, (
              "Interaction grid mismatch: "
              f"expected {expected_pairs}, "
              f"got {actual_pairs}"
          )

          # --------------------------------------------------
          # Formal 2×2 interaction output
          #
          # The current implementation stores these rows
          # in data["interactions"].
          # --------------------------------------------------

          formal = data.get(
              "interactions",
              []
          )

          assert len(formal) == 16, (
              f"Expected 16 formal interaction rows, "
              f"got {len(formal)}"
          )

          required_fields = [
              "si_tail",
              "vol_tail",
              "si_high_vol_n",
              "si_low_vol_n",
              "si_high_vol_event_rate",
              "si_low_vol_event_rate",
              "event_rate_difference",
              "si_high_vol_lift",
              "si_low_vol_lift",
              "lift_ratio_high_vs_low_vol",
              "return_difference_high_vol",
              "return_difference_low_vol",
          ]

          formal_pairs = set()

          for row in formal:
              for field in required_fields:
                  assert field in row, (
                      f"Missing {field} in "
                      f"interaction row: {row}"
                  )

              si_tail = row["si_tail"]
              vol_tail = row["vol_tail"]

              assert (
                  si_tail in expected_tails
              ), row

              assert (
                  vol_tail in expected_tails
              ), row

              formal_pairs.add(
                  (si_tail, vol_tail)
              )

              # Basic numerical consistency.
              expected_difference = (
                  row["si_high_vol_event_rate"]
                  - row["si_low_vol_event_rate"]
              )

              assert abs(
                  expected_difference
                  - row["event_rate_difference"]
              ) < 1e-12, row

              # Lift ratio must be based on the two
              # subgroup lifts.
              expected_ratio = (
                  row["si_high_vol_lift"]
                  / row["si_low_vol_lift"]
              )

              assert abs(
                  expected_ratio
                  - row["lift_ratio_high_vs_low_vol"]
              ) < 1e-10, row

          assert formal_pairs == expected_pairs, (
              "Formal interaction grid mismatch: "
              f"expected {expected_pairs}, "
              f"got {formal_pairs}"
          )

          # --------------------------------------------------
          # Final verification summary
          # --------------------------------------------------

          print(
              "Interaction verification passed."
          )

          print(
              f"Rows: {data['rows']}"
          )

          print(
              f"SI-only rows: "
              f"{len(si_only)}"
          )

          print(
              f"Volatility-only rows: "
              f"{len(vol_only)}"
          )

          print(
              f"SI×Vol rows: "
              f"{len(interaction_rows)}"
          )

          print(
              f"Formal interaction rows: "
              f"{len(formal)}"
          )

          print(
              "Verified all 16 SI×VOL combinations."
          )
          PY

      - name: Verify subgroup outputs
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(
              "data/processed/ml/research"
          )

          subgroup_files = list(
              root.rglob("*subgroup*.json")
          ) + list(
              root.rglob("*subgroup*.csv")
          )

          if subgroup_files:
              print(
                  "Subgroup outputs found:"
              )

              for path in subgroup_files:
                  print(path)
          else:
              print(
                  "No separate subgroup files found; "
                  "skipping."
              )

          print(
              "Subgroup verification passed."
          )
          PY

      - name: Persist frozen research results
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/ml/research/discovery/ \
            data/processed/ml/research/frozen/ \
            data/processed/ml/research/interaction/

          if git diff --cached --quiet; then
            echo "No research result changes to commit."
            exit 0
          fi

          git commit \
            -m "Update ML research results"

          git push
