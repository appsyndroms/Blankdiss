name: ML Frozen Research

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DISCOVERY_CONFIG: |
    enabled: true
    discovery_end_date: "2025-12-19"
    targets:
      - down_10pct_5d
    signals:
      - short_interest_change
    stress_features:
      - price_volatility_20d
    tails:
      - 0.01
      - 0.025
      - 0.05
      - 0.10
    stress_directions:
      price_volatility_20d: upper
    validation:
      min_rows_per_window: 20
      min_positive_windows: 2
      min_lift: 1.10
      max_return_difference: 0.0
      max_findings: 25

jobs:
  frozen-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run frozen discovery
        env:
          DISCOVERY_CONFIG: ${{ env.DISCOVERY_CONFIG }}
        run: |
          python -m ml.research.discovery.runner

      - name: Run frozen interaction analysis
        run: |
          python -m ml.research.interaction_analysis

      - name: Verify frozen research outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          discovery_root = Path(
              "data/processed/ml/research/discovery"
          )

          frozen_root = Path(
              "data/processed/ml/research/frozen"
          )

          discovery_metadata = (
              discovery_root
              / "latest"
              / "metadata.json"
          )

          if not discovery_metadata.exists():
              raise SystemExit(
                  f"Missing discovery metadata: "
                  f"{discovery_metadata}"
              )

          with discovery_metadata.open() as f:
              discovery = json.load(f)

          # --------------------------------------------------
          # Discovery configuration
          # --------------------------------------------------

          assert discovery["targets"] == [
              "down_10pct_5d"
          ]

          assert discovery["signals"] == [
              "short_interest_change"
          ]

          assert discovery["stress_features"] == [
              "price_volatility_20d"
          ]

          assert discovery["tails"] == [
              0.01,
              0.025,
              0.05,
              0.1,
          ]

          assert (
              discovery["stress_directions"][
                  "price_volatility_20d"
              ]
              == "upper"
          )

          # --------------------------------------------------
          # Basic discovery output validation
          # --------------------------------------------------

          assert discovery["feature_rows"] > 0

          assert (
              discovery["candidate_count"]
              == 16
          )

          assert (
              discovery["result_count"]
              == 32
          )

          assert (
              discovery["pooled_count"]
              == 16
          )

          windows = discovery[
              "walk_forward_windows"
          ]

          assert len(windows) == 2

          print(
              "Discovery verification passed."
          )

          print(
              f"Feature rows: "
              f"{discovery['feature_rows']}"
          )

          print(
              f"Candidates: "
              f"{discovery['candidate_count']}"
          )

          print(
              f"Results: "
              f"{discovery['result_count']}"
          )

          print(
              f"Pooled: "
              f"{discovery['pooled_count']}"
          )

          # --------------------------------------------------
          # Frozen metadata validation
          # --------------------------------------------------

          matching_frozen_metadata = []

          for path in frozen_root.rglob(
              "metadata.json"
          ):
              try:
                  with path.open() as f:
                      metadata = json.load(f)
              except Exception:
                  continue

              if (
                  metadata.get(
                      "discovery_end_date"
                  )
                  == "2025-12-19"
              ):
                  matching_frozen_metadata.append(
                      path
                  )

          if not matching_frozen_metadata:
              raise SystemExit(
                  "No frozen metadata with "
                  "discovery_end_date=2025-12-19 "
                  "was found."
              )

          print(
              "Frozen metadata verification passed."
          )

          for path in matching_frozen_metadata:
              print(
                  f"Verified frozen metadata: "
                  f"{path}"
              )
          PY

      - name: Verify interaction outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "data/processed/ml/research/interaction"
          )

          required = [
              root / "results.json",
              root / "results.csv",
              root / "interactions.csv",
          ]

          # --------------------------------------------------
          # Required files
          # --------------------------------------------------

          for path in required:
              if not path.exists():
                  raise SystemExit(
                      f"Missing interaction output: "
                      f"{path}"
                  )

          # --------------------------------------------------
          # Load JSON
          # --------------------------------------------------

          results_json = root / "results.json"

          with results_json.open() as f:
              data = json.load(f)

          # --------------------------------------------------
          # Core metadata
          # --------------------------------------------------

          assert (
              data["target"]
              == "down_10pct_5d"
          )

          assert (
              data["discovery_end"]
              == "2025-12-19"
          )

          assert data["rows"] > 0

          results = data["results"]

          # --------------------------------------------------
          # Expected tails
          # --------------------------------------------------

          expected_tails = [
              0.01,
              0.025,
              0.05,
              0.1,
          ]

          expected_pairs = {
              (si_tail, vol_tail)
              for si_tail in expected_tails
              for vol_tail in expected_tails
          }

          # --------------------------------------------------
          # SI-only rows
          # --------------------------------------------------

          si_only = [
              r
              for r in results
              if r.get("analysis")
              == "si_only"
          ]

          assert len(si_only) == 4, (
              f"Expected 4 SI-only rows, "
              f"got {len(si_only)}"
          )

          assert sorted(
              r["si_tail"]
              for r in si_only
          ) == expected_tails

          # --------------------------------------------------
          # Volatility-only rows
          # --------------------------------------------------

          vol_only = [
              r
              for r in results
              if r.get("analysis")
              == "volatility_only"
          ]

          assert len(vol_only) == 4, (
              f"Expected 4 volatility-only rows, "
              f"got {len(vol_only)}"
          )

          assert sorted(
              r["vol_tail"]
              for r in vol_only
          ) == expected_tails

          # --------------------------------------------------
          # SI × volatility rows
          # --------------------------------------------------

          interaction_rows = [
              r
              for r in results
              if r.get("analysis")
              == "interaction"
          ]

          assert len(interaction_rows) == 16, (
              f"Expected 16 SI×VOL rows, "
              f"got {len(interaction_rows)}"
          )

          actual_pairs = {
              (
                  r["si_tail"],
                  r["vol_tail"],
              )
              for r in interaction_rows
          }

          assert (
              actual_pairs
              == expected_pairs
          ), (
              "Interaction grid mismatch: "
              f"expected {expected_pairs}, "
              f"got {actual_pairs}"
          )

          # --------------------------------------------------
          # Formal 2×2 interaction rows
          #
          # The implementation stores the formal rows
          # in data["interactions"].
          # --------------------------------------------------

          formal = data.get(
              "interactions",
              []
          )

          assert len(formal) == 16, (
              f"Expected 16 formal interaction "
              f"rows, got {len(formal)}"
          )

          formal_pairs = set()

          required_cells = [
              "cell_11_si_high_vol_high",
              "cell_10_si_high_vol_low",
              "cell_01_si_low_vol_high",
              "cell_00_si_low_vol_low",
          ]

          required_fields = [
              "risk_difference_interaction",
              "risk_difference_interaction_ci_low",
              "risk_difference_interaction_ci_high",
              "risk_ratio_interaction",
              "rr_interaction_ci_low",
              "rr_interaction_ci_high",
              "return_interaction",
              "vol_effect_when_si_high",
              "vol_effect_when_si_low",
              "si_effect_when_vol_high",
              "si_effect_when_vol_low",
          ]

          for row in formal:
              si_tail = row["si_tail"]
              vol_tail = row["vol_tail"]

              assert (
                  si_tail
                  in expected_tails
              ), row

              assert (
                  vol_tail
                  in expected_tails
              ), row

              formal_pairs.add(
                  (si_tail, vol_tail)
              )

              # ------------------------------------------------
              # Verify all four 2×2 cells.
              # ------------------------------------------------

              for cell_name in required_cells:
                  assert cell_name in row, (
                      f"Missing {cell_name}: "
                      f"{row}"
                  )

                  cell = row[cell_name]

                  for field in [
                      "label",
                      "n",
                      "events",
                      "event_rate",
                      "mean_return",
                  ]:
                      assert field in cell, (
                          f"Missing {field} in "
                          f"{cell_name}: {row}"
                      )

                  assert cell["n"] >= 0

                  assert cell["events"] >= 0

                  assert (
                      cell["events"]
                      <= cell["n"]
                  )

                  if cell["n"] > 0:
                      expected_rate = (
                          cell["events"]
                          / cell["n"]
                      )

                      assert abs(
                          expected_rate
                          - cell["event_rate"]
                      ) < 1e-12, row

              # ------------------------------------------------
              # Verify formal statistics exist.
              # ------------------------------------------------

              for field in required_fields:
                  assert field in row, (
                      f"Missing {field}: "
                      f"{row}"
                  )

              # ------------------------------------------------
              # Extract 2×2 cells.
              #
              # 11 = SI high + volatility high
              # 10 = SI high + volatility low
              # 01 = SI low + volatility high
              # 00 = SI low + volatility low
              # ------------------------------------------------

              cell_11 = row[
                  "cell_11_si_high_vol_high"
              ]

              cell_10 = row[
                  "cell_10_si_high_vol_low"
              ]

              cell_01 = row[
                  "cell_01_si_low_vol_high"
              ]

              cell_00 = row[
                  "cell_00_si_low_vol_low"
              ]

              # ------------------------------------------------
              # Verify volatility effect when SI is high.
              #
              # 11 - 10
              # ------------------------------------------------

              expected_vol_effect_si_high = (
                  cell_11["event_rate"]
                  - cell_10["event_rate"]
              )

              assert abs(
                  expected_vol_effect_si_high
                  - row[
                      "vol_effect_when_si_high"
                  ]
              ) < 1e-12, row

              # ------------------------------------------------
              # Verify volatility effect when SI is low.
              #
              # 01 - 00
              # ------------------------------------------------

              expected_vol_effect_si_low = (
                  cell_01["event_rate"]
                  - cell_00["event_rate"]
              )

              assert abs(
                  expected_vol_effect_si_low
                  - row[
                      "vol_effect_when_si_low"
                  ]
              ) < 1e-12, row

              # ------------------------------------------------
              # Verify SI effect when volatility is high.
              #
              # 11 - 01
              # ------------------------------------------------

              expected_si_effect_vol_high = (
                  cell_11["event_rate"]
                  - cell_01["event_rate"]
              )

              assert abs(
                  expected_si_effect_vol_high
                  - row[
                      "si_effect_when_vol_high"
                  ]
              ) < 1e-12, row

              # ------------------------------------------------
              # Verify SI effect when volatility is low.
              #
              # 10 - 00
              # ------------------------------------------------

              expected_si_effect_vol_low = (
                  cell_10["event_rate"]
                  - cell_00["event_rate"]
              )

              assert abs(
                  expected_si_effect_vol_low
                  - row[
                      "si_effect_when_vol_low"
                  ]
              ) < 1e-12, row

              # ------------------------------------------------
              # Verify additive interaction.
              #
              # (11 - 10) - (01 - 00)
              #
              # Equivalently:
              #
              # 11 - 10 - 01 + 00
              # ------------------------------------------------

              expected_interaction = (
                  expected_vol_effect_si_high
                  - expected_vol_effect_si_low
              )

              assert abs(
                  expected_interaction
                  - row[
                      "risk_difference_interaction"
                  ]
              ) < 1e-12, row

              # ------------------------------------------------
              # Basic CI ordering checks.
              # ------------------------------------------------

              assert (
                  row[
                      "risk_difference_interaction_ci_low"
                  ]
                  <= row[
                      "risk_difference_interaction_ci_high"
                  ]
              )

              assert (
                  row[
                      "rr_interaction_ci_low"
                  ]
                  <= row[
                      "rr_interaction_ci_high"
                  ]
              )

          # --------------------------------------------------
          # Complete 16-cell grid
          # --------------------------------------------------

          assert (
              formal_pairs
              == expected_pairs
          ), (
              "Formal interaction grid mismatch: "
              f"expected {expected_pairs}, "
              f"got {formal_pairs}"
          )

          # --------------------------------------------------
          # Final verification summary
          # --------------------------------------------------

          print(
              "Interaction verification passed."
          )

          print(
              f"Rows: {data['rows']}"
          )

          print(
              f"SI-only rows: "
              f"{len(si_only)}"
          )

          print(
              f"Volatility-only rows: "
              f"{len(vol_only)}"
          )

          print(
              f"SI×Vol rows: "
              f"{len(interaction_rows)}"
          )

          print(
              f"Formal interaction rows: "
              f"{len(formal)}"
          )

          print(
              "Verified all 16 SI×VOL combinations."
          )

          print(
              "Verified all four 2×2 cells "
              "per combination."
          )

          print(
              "Verified marginal effects "
              "and additive interaction."
          )
          PY

      - name: Verify subgroup outputs
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(
              "data/processed/ml/research"
          )

          subgroup_files = list(
              root.rglob("*subgroup*.json")
          ) + list(
              root.rglob("*subgroup*.csv")
          )

          if subgroup_files:
              print(
                  "Subgroup outputs found:"
              )

              for path in subgroup_files:
                  print(path)
          else:
              print(
                  "No separate subgroup files found; "
                  "skipping."
              )

          print(
              "Subgroup verification passed."
          )
          PY

      - name: Persist frozen research results
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/ml/research/discovery/ \
            data/processed/ml/research/frozen/ \
            data/processed/ml/research/interaction/

          if git diff --cached --quiet; then
            echo "No research result changes to commit."
            exit 0
          fi

          git commit \
            -m "Update ML research results"

          git push
