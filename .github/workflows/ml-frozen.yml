name: ML Frozen Research
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frozen-research:
    runs-on: ubuntu-latest
    env:
      DISCOVERY_CONFIG: |
        enabled: true
        discovery_end_date: "2025-12-19"
        targets:
          - down_10pct_5d
        signals:
          - short_interest_change
        stress_features:
          - price_volatility_20d
          - price_momentum_5d
          - price_momentum_20d
          - price_momentum_60d
          - distance_from_20d_high
          - distance_from_60d_high
        tails:
          - 0.01
          - 0.025
        stress_directions:
          price_volatility_20d: upper
          price_momentum_5d: lower
          price_momentum_20d: lower
          price_momentum_60d: lower
          distance_from_20d_high: lower
          distance_from_60d_high: lower
        validation:
          min_rows: 20
          min_events: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch FI data
        run: |
          python -m ml.data.fetch_fi
      - name: Fetch price data
        run: |
          python -m ml.data.fetch_prices
      - name: Feature source check
        run: |
          python -m ml.research.feature_source_check
      - name: Build features
        run: |
          python -m ml.research.build_features
      - name: Feature QC
        run: |
          python -m ml.research.feature_qc
      - name: Verify feature dataset
        run: |
          python -m ml.research.verify_feature_dataset
      - name: Verify frozen hypothesis
        run: |
          python -m ml.research.frozen.verify_config
      - name: Run frozen hypothesis
        run: |
          python -m ml.research.frozen.runner
      - name: Run frozen subgroup analysis
        run: |
          python -m ml.research.frozen.subgroup_runner
      - name: Verify subgroup outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          hypothesis_path = Path(
              "ml/research/frozen/hypothesis.yml"
          )
          output_dir = Path(
              "data/processed/ml/research/frozen/subgroups"
          )
          if not output_dir.exists():
              raise SystemExit(
                  "Subgroup output directory saknas."
              )
          required_files = [
              "period.csv",
              "sector.csv",
              "market_regime.csv",
              "metadata.json",
          ]
          for filename in required_files:
              path = output_dir / filename
              if not path.exists():
                  raise SystemExit(
                      f"Saknad subgroup-fil: {path}"
                  )
          import yaml
          with hypothesis_path.open(
              "r",
              encoding="utf-8",
          ) as handle:
              hypothesis = yaml.safe_load(handle)
          expected = hypothesis["hypothesis"]
          with (
              output_dir / "metadata.json"
          ).open(
              "r",
              encoding="utf-8",
          ) as handle:
              metadata = json.load(handle)
          checks = {
              "candidate_id": (
                  expected["candidate"]["candidate_id"],
                  metadata.get("candidate_id"),
              ),
              "evaluation_start": (
                  expected["evaluation"]["start_date"],
                  metadata.get("evaluation_start"),
              ),
              "evaluation_end": (
                  expected["evaluation"]["end_date"],
                  metadata.get("evaluation_end"),
              ),
              "discovery_end_date": (
                  expected["source"]["discovery_end_date"],
                  metadata.get("discovery_end_date"),
              ),
          }
          for name, (expected_value, actual_value) in checks.items():
              if actual_value != expected_value:
                  raise SystemExit(
                      f"Fel subgroup-metadata för {name}: "
                      f"expected={expected_value!r}, "
                      f"actual={actual_value!r}"
                  )
          print("Subgroup outputs verified.")
          print(
              f"Candidate: {metadata['candidate_id']}"
          )
          print(
              f"OOS: {metadata['evaluation_start']} "
              f"-> {metadata['evaluation_end']}"
          )
          PY
      - name: Upload frozen research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frozen-research
          path: |
            data/processed/ml/research/frozen/
            ml/research/frozen/hypothesis.yml
          if-no-files-found: error
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/ml/research/frozen/ \
            ml/research/frozen/hypothesis.yml
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit \
            -m "Update frozen ML research outputs"
          git push
