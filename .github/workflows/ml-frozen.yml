name: ML Frozen Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-frozen-main
  cancel-in-progress: false

env:
  DISCOVERY_CONFIG: |
    enabled: true
    discovery_end_date: "2025-12-19"
    targets:
      - down_10pct_5d
    signals:
      - short_interest_change
    stress_features:
      - price_volatility_20d
    tails:
      - 0.01
      - 0.025
    stress_directions:
      price_volatility_20d: upper
    validation:
      min_rows_per_window: 20
      min_positive_windows: 2
      min_lift: 1.10
      max_return_difference: 0.0
      max_findings: 25

jobs:
  frozen-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch FI aggregate
        run: |
          python -u -m fi

      - name: Fetch prices
        run: |
          python -m prices --start 2022-01-01

      - name: Check feature source
        run: |
          python -u -m analysis.feature_source_check

      - name: Build features
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -u -m analysis.build_features

      - name: Inspect feature dataset
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -m analysis.ci inspect-features

      - name: Verify feature dataset
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -m analysis.ci verify-features

      - name: Run Feature QC
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -u -m analysis.features_qc

      - name: Verify Feature QC
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -m analysis.ci verify-feature-qc

      - name: Verify feature dataset exists
        run: |
          test -f data/processed/analysis/features_metadata.json
          test -n "$(
            find data/processed/analysis \
              -maxdepth 1 \
              -type f \
              -name 'features_*.jsonl' \
              -print \
              -quit
          )"

      - name: Verify frozen hypothesis
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("ml/research/frozen/hypothesis.yml")

          if not path.exists():
              raise SystemExit(
                  f"Frozen hypothesis saknas: {path}"
              )

          with path.open(encoding="utf-8") as handle:
              document = yaml.safe_load(handle)

          if not isinstance(document, dict):
              raise SystemExit(
                  "Frozen hypothesis är inte ett YAML-objekt."
              )

          hypothesis = document.get("hypothesis")

          if not isinstance(hypothesis, dict):
              raise SystemExit(
                  "Saknar 'hypothesis' i frozen hypothesis."
              )

          if hypothesis.get("status") != "frozen":
              raise SystemExit(
                  "Frozen hypothesis har inte status='frozen'."
              )

          candidate = hypothesis.get("candidate")
          evaluation = hypothesis.get("evaluation")
          null_test = hypothesis.get("null_test")

          if not isinstance(candidate, dict):
              raise SystemExit(
                  "Saknar candidate-konfiguration."
              )

          if not isinstance(evaluation, dict):
              raise SystemExit(
                  "Saknar evaluation-konfiguration."
              )

          if not isinstance(null_test, dict):
              raise SystemExit(
                  "Saknar null_test-konfiguration."
              )

          required_candidate_fields = [
              "candidate_id",
              "target_name",
              "signal_name",
              "signal_tail",
              "stress_feature",
              "stress_tail",
              "stress_direction",
          ]

          for field in required_candidate_fields:
              if field not in candidate:
                  raise SystemExit(
                      f"Saknar candidate-fält: {field}"
                  )

          if candidate["stress_direction"] not in {
              "upper",
              "lower",
          }:
              raise SystemExit(
                  "Ogiltig stress_direction: "
                  f"{candidate['stress_direction']!r}"
              )

          if evaluation.get("start_date") != "2025-12-20":
              raise SystemExit(
                  "Fel frozen OOS-start."
              )

          if evaluation.get("end_date") != "2026-09-18":
              raise SystemExit(
                  "Fel frozen OOS-slut."
              )

          if null_test.get("permutations") != 1000:
              raise SystemExit(
                  "Fel antal null-permutationer."
              )

          print("Frozen hypothesis verification passed.")
          print(
              f"Candidate: {candidate['candidate_id']}"
          )
          print(
              f"Target: {candidate['target_name']}"
          )
          print(
              f"Signal: {candidate['signal_name']}"
          )
          print(
              f"Stress: {candidate['stress_feature']} "
              f"({candidate['stress_direction']})"
          )
          print(
              f"OOS: {evaluation['start_date']} "
              f"-> {evaluation['end_date']}"
          )
          print(
              f"Null permutations: "
              f"{null_test['permutations']}"
          )
          PY

      - name: Run frozen hypothesis
        run: |
          python -u -m ml.research.frozen.runner

      - name: Inspect frozen outputs
        if: always()
        run: |
          echo "=== Frozen output directory ==="
          find data/processed/ml/research/frozen \
            -maxdepth 3 \
            -type f \
            -print 2>/dev/null || true

          echo "=== Latest metadata ==="
          if [ -f data/processed/ml/research/frozen/latest/metadata.json ]; then
            cat data/processed/ml/research/frozen/latest/metadata.json
          else
            echo "latest/metadata.json saknas"
          fi

          echo "=== Latest result ==="
          if [ -f data/processed/ml/research/frozen/latest/result.json ]; then
            cat data/processed/ml/research/frozen/latest/result.json
          else
            echo "latest/result.json saknas"
          fi

          echo "=== Latest null test ==="
          if [ -f data/processed/ml/research/frozen/latest/null_test.json ]; then
            cat data/processed/ml/research/frozen/latest/null_test.json
          else
            echo "latest/null_test.json saknas"
          fi

          echo "=== Git status ==="
          git status --short

      - name: Run frozen subgroup analysis
        run: |
          python -u -m ml.research.frozen.subgroup_runner

      - name: Verify frozen results
        run: |
          test -f data/processed/ml/research/frozen/latest/result.json
          test -f data/processed/ml/research/frozen/latest/null_test.json
          test -f data/processed/ml/research/frozen/latest/metadata.json

          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          base = Path(
              "data/processed/ml/research/frozen/latest"
          )

          hypothesis_path = Path(
              "ml/research/frozen/hypothesis.yml"
          )

          result_path = base / "result.json"
          null_test_path = base / "null_test.json"
          metadata_path = base / "metadata.json"

          if not result_path.exists():
              raise SystemExit(
                  f"Saknat frozen-resultat: {result_path}"
              )

          if not null_test_path.exists():
              raise SystemExit(
                  f"Saknat null-test-resultat: {null_test_path}"
              )

          if not metadata_path.exists():
              raise SystemExit(
                  f"Saknad frozen-metadata: {metadata_path}"
              )

          hypothesis = yaml.safe_load(
              hypothesis_path.read_text(
                  encoding="utf-8"
              )
          )

          expected = hypothesis["hypothesis"]

          result = json.loads(
              result_path.read_text(
                  encoding="utf-8"
              )
          )

          null_test = json.loads(
              null_test_path.read_text(
                  encoding="utf-8"
              )
          )

          metadata = json.loads(
              metadata_path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(result, dict):
              raise SystemExit(
                  "Frozen result är inte ett objekt."
              )

          if not isinstance(null_test, dict):
              raise SystemExit(
                  "Frozen null-test är inte ett objekt."
              )

          if not isinstance(metadata, dict):
              raise SystemExit(
                  "Frozen metadata är inte ett objekt."
              )

          expected_candidate = expected[
              "candidate"
          ]["candidate_id"]

          actual_candidate = metadata.get(
              "candidate",
              {}
          ).get("candidate_id")

          if actual_candidate != expected_candidate:
              raise SystemExit(
                  "Fel frozen candidate_id: "
                  f"expected={expected_candidate!r}, "
                  f"actual={actual_candidate!r}"
              )

          expected_start = expected[
              "evaluation"
          ]["start_date"]

          actual_start = metadata.get(
              "evaluation_start_date"
          )

          if actual_start != expected_start:
              raise SystemExit(
                  "Fel frozen evaluation_start: "
                  f"expected={expected_start!r}, "
                  f"actual={actual_start!r}"
              )

          expected_end = expected[
              "evaluation"
          ]["end_date"]

          actual_end = metadata.get(
              "evaluation_end_date"
          )

          if actual_end != expected_end:
              raise SystemExit(
                  "Fel frozen evaluation_end: "
                  f"expected={expected_end!r}, "
                  f"actual={actual_end!r}"
              )

          expected_permutations = expected[
              "null_test"
          ]["permutations"]

          actual_permutations = null_test.get(
              "permutations_requested"
          )

          if actual_permutations != expected_permutations:
              raise SystemExit(
                  "Fel antal null-permutationer: "
                  f"expected={expected_permutations}, "
                  f"actual={actual_permutations}"
              )

          expected_metric = expected[
              "null_test"
          ]["metric"]

          actual_metric = null_test.get(
              "metric"
          )

          if actual_metric != expected_metric:
              raise SystemExit(
                  "Fel null-test metric: "
                  f"expected={expected_metric!r}, "
                  f"actual={actual_metric!r}"
              )

          print("Frozen verification passed.")
          print(
              f"Candidate: {actual_candidate}"
          )
          print(
              f"OOS: {actual_start} -> {actual_end}"
          )
          print(
              f"Null metric: {actual_metric}"
          )
          print(
              f"Null permutations: "
              f"{actual_permutations}"
          )
          print(
              f"Observed metric: "
              f"{null_test.get('observed')}"
          )
          print(
              f"Empirical p-value: "
              f"{null_test.get('p_value')}"
          )
          PY

      - name: Verify subgroup outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          hypothesis_path = Path(
              "ml/research/frozen/hypothesis.yml"
          )

          output_dir = Path(
              "data/processed/ml/research/frozen/subgroups"
          )

          if not output_dir.exists():
              raise SystemExit(
                  "Subgroup output directory saknas."
              )

          required_files = [
              "period.csv",
              "sector.csv",
              "market_regime.csv",
              "metadata.json",
          ]

          for filename in required_files:
              path = output_dir / filename

              if not path.exists():
                  raise SystemExit(
                      f"Saknad subgroup-fil: {path}"
                  )

          hypothesis = yaml.safe_load(
              hypothesis_path.read_text(
                  encoding="utf-8"
              )
          )

          expected = hypothesis["hypothesis"]

          metadata = json.loads(
              (
                  output_dir / "metadata.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(metadata, dict):
              raise SystemExit(
                  "Subgroup metadata är inte ett objekt."
              )

          checks = {
              "candidate_id": (
                  expected["candidate"][
                      "candidate_id"
                  ],
                  metadata.get(
                      "candidate_id"
                  ),
              ),
              "evaluation_start": (
                  expected["evaluation"][
                      "start_date"
                  ],
                  metadata.get(
                      "evaluation_start"
                  ),
              ),
              "evaluation_end": (
                  expected["evaluation"][
                      "end_date"
                  ],
                  metadata.get(
                      "evaluation_end"
                  ),
              ),
              "discovery_end_date": (
                  expected["source"][
                      "discovery_end_date"
                  ],
                  metadata.get(
                      "discovery_end_date"
                  ),
              ),
          }

          for name, (
              expected_value,
              actual_value,
          ) in checks.items():
              if actual_value != expected_value:
                  raise SystemExit(
                      f"Fel subgroup-metadata för "
                      f"{name}: "
                      f"expected={expected_value!r}, "
                      f"actual={actual_value!r}"
                  )

          print(
              "Subgroup verification passed."
          )
          print(
              f"Candidate: "
              f"{metadata['candidate_id']}"
          )
          print(
              f"OOS: "
              f"{metadata['evaluation_start']} "
              f"-> "
              f"{metadata['evaluation_end']}"
          )
          PY

      - name: Upload frozen research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frozen-research
          path: |
            data/processed/ml/research/frozen/
            ml/research/frozen/hypothesis.yml
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Persist frozen research results
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/ml/research/frozen/

          if git diff --cached --quiet; then
            echo "Inga frozen-resultat ändrades."
            exit 0
          fi

          git commit \
            -m "Update frozen ML research results"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push lyckades."
                exit 0
              fi
            else
              echo "Rebase misslyckades."
              git rebase --abort || true
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Remote ändrades. Försöker igen..."
              sleep 5
            fi
          done

          echo "Kunde inte pusha frozen-resultaten."
          exit 1
