name: ML Frozen Verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh FI data
        run: |
          python -u -m fi
      - name: Refresh prices
        run: |
          python -u -m prices --start 2022-01-01
      - name: Check whether features need rebuilding
        run: |
          python -u -m analysis.feature_source_check
      - name: Build features
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -u -m analysis.build_features
      - name: Inspect feature dataset
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -u -m analysis.inspect_features
      - name: Verify feature dataset
        run: |
          python -u -m analysis.verify_features
      - name: Feature QC
        if: env.FEATURES_CHANGED == 'true'
        run: |
          python -u -m analysis.feature_qc
      - name: Verify frozen configuration
        run: |
          python -u -m ml.research.frozen.verify_config
      - name: Run frozen hypothesis
        run: |
          python -u -m ml.research.frozen.runner
      - name: Run subgroup analysis
        run: |
          python -u -m ml.research.frozen.subgroup_runner
      - name: Verify subgroup outputs
        run: |
          python -u -m ml.research.frozen.verify_subgroup_outputs
      - name: Upload frozen research outputs
        uses: actions/upload-artifact@v4
        with:
          name: frozen-research-results
          path: |
            ml/research/frozen/results/
            ml/research/frozen/subgroups/
      - name: Commit frozen outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ml/research/frozen/results \
            ml/research/frozen/subgroups
          if git diff --cached --quiet; then
            echo "No frozen output changes to commit."
          else
            git commit -m "Update frozen research results"
            git push
          fi
