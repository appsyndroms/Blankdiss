name: ML Frozen Hypothesis
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-frozen
  cancel-in-progress: false
jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh short interest data
        run: |
          python -u -m fi
      - name: Refresh price data
        run: |
          python -u -m prices --start 2022-01-01
      - name: Build features
        run: |
          python -u -m ml.features.build
      - name: Inspect features
        run: |
          python -u -m ml.features.inspect
      - name: Verify features
        run: |
          python -u -m ml.features.verify
      - name: Feature QC
        run: |
          python -u -m ml.features.qc
      - name: Verify feature QC
        run: |
          python -u -m ml.features.verify_qc
      - name: Verify frozen hypothesis configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path(
              "ml/research/frozen/hypothesis.yaml"
          )
          with path.open(
              "r",
              encoding="utf-8",
          ) as f:
              config = yaml.safe_load(f)
          hypothesis = config["hypothesis"]
          source = hypothesis["source"]
          candidate = hypothesis["candidate"]
          evaluation = hypothesis["evaluation"]
          assert hypothesis["status"] == "frozen"
          assert (
              source["discovery_run"]
              == "20260919T192154Z"
          )
          assert (
              source["discovery_end_date"]
              == "2025-12-19"
          )
          assert (
              candidate["candidate_id"]
              == (
                  "short_interest_change__1pct__"
                  "price_volatility_20d__upper__"
                  "2_5pct__down_10pct_5d"
              )
          )
          assert (
              candidate["target_name"]
              == "down_10pct_5d"
          )
          assert (
              candidate["signal_name"]
              == "short_interest_change"
          )
          assert (
              candidate["signal_tail"]
              == 0.01
          )
          assert (
              candidate["stress_feature"]
              == "price_volatility_20d"
          )
          assert (
              candidate["stress_tail"]
              == 0.025
          )
          assert (
              candidate["stress_direction"]
              == "upper"
          )
          assert (
              evaluation["start_date"]
              == "2025-12-20"
          )
          assert (
              evaluation["end_date"]
              == "2026-09-18"
          )
          assert (
              hypothesis["null_test"]["metric"]
              == "lift"
          )
          assert (
              hypothesis["null_test"]["permutations"]
              == 1000
          )
          assert (
              hypothesis["null_test"]["seed"]
              == 42
          )
          print(
              "Frozen hypothesis configuration verified."
          )
          PY
      - name: Run frozen hypothesis
        run: |
          python -u -m ml.research.frozen.runner
      - name: Verify frozen hypothesis result
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          output_dir = Path(
              "data/processed/ml/research/frozen"
          )
          required_files = [
              "result.json",
              "report.md",
          ]
          for filename in required_files:
              path = output_dir / filename
              if not path.exists():
                  raise SystemExit(
                      f"Missing frozen output: {path}"
                  )
          result_path = output_dir / "result.json"
          with result_path.open(
              "r",
              encoding="utf-8",
          ) as f:
              result = json.load(f)
          print(
              "Frozen verification passed."
          )
          print(
              "Rows:",
              result.get("n"),
          )
          print(
              "Events:",
              result.get("events"),
          )
          print(
              "Event rate:",
              result.get("event_rate"),
          )
          print(
              "Baseline:",
              result.get("baseline_event_rate"),
          )
          print(
              "Lift:",
              result.get("lift"),
          )
          print(
              "Return difference:",
              result.get("return_difference"),
          )
          print(
              "Null permutations:",
              result.get("null_test", {}).get(
                  "permutations"
              ),
          )
          print(
              "Null p-value:",
              result.get("null_test", {}).get(
                  "p_value"
              ),
          )
          PY
      - name: Run frozen subgroup analysis
        run: |
          python -u -m ml.research.frozen.subgroup_runner
      - name: Verify subgroup outputs
        run: |
          test -f \
            data/processed/ml/research/frozen/subgroups/period.csv
          test -f \
            data/processed/ml/research/frozen/subgroups/sector.csv
          test -f \
            data/processed/ml/research/frozen/subgroups/market_regime.csv
          test -f \
            data/processed/ml/research/frozen/subgroups/metadata.json
      - name: Print subgroup analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          output_dir = Path(
              "data/processed/ml/research/frozen/subgroups"
          )
          for filename in [
              "period.csv",
              "sector.csv",
              "market_regime.csv",
          ]:
              path = output_dir / filename
              print()
              print("=" * 80)
              print(filename)
              print("=" * 80)
              if path.stat().st_size == 0:
                  print("Empty file.")
                  continue
              print(
                  path.read_text(
                      encoding="utf-8"
                  )
              )
          PY
      - name: Upload frozen hypothesis artifact
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-frozen-hypothesis
          path: |
            data/processed/ml/research/frozen
      - name: Commit frozen research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/ml/research/frozen
          if git diff --cached --quiet; then
            echo "No frozen research changes to commit."
            exit 0
          fi
          git commit \
            -m "Update frozen hypothesis results"
          git push
