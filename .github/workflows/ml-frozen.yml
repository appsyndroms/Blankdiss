name: ML Frozen Research

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DISCOVERY_CONFIG: |
    enabled: true
    discovery_end_date: "2025-12-19"
    targets:
      - down_10pct_5d
    signals:
      - short_interest_change
    stress_features:
      - price_volatility_20d
    tails:
      - 0.01
      - 0.025
      - 0.05
      - 0.10
    stress_directions:
      price_volatility_20d: upper
    validation:
      min_rows_per_window: 20
      min_positive_windows: 2
      min_lift: 1.10
      max_return_difference: 0.0
      max_findings: 25

jobs:
  frozen-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run frozen discovery
        env:
          DISCOVERY_CONFIG: ${{ env.DISCOVERY_CONFIG }}
        run: |
          python -m ml.research.discovery

      - name: Run frozen interaction analysis
        run: |
          python -m ml.research.interaction_analysis

      - name: Verify frozen research outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          discovery_root = Path("data/processed/ml/research/discovery")
          frozen_root = Path("data/processed/ml/research/frozen")

          discovery_files = list(discovery_root.rglob("metadata.json"))
          frozen_files = list(frozen_root.rglob("metadata.json"))

          if not discovery_files:
              raise SystemExit("No discovery metadata found")

          if not frozen_files:
              raise SystemExit("No frozen metadata found")

          latest_discovery = max(
              discovery_files,
              key=lambda p: p.stat().st_mtime
          )

          latest_frozen = max(
              frozen_files,
              key=lambda p: p.stat().st_mtime
          )

          print(f"Latest discovery metadata: {latest_discovery}")
          print(f"Latest frozen metadata: {latest_frozen}")

          with latest_discovery.open() as f:
              discovery = json.load(f)

          with latest_frozen.open() as f:
              frozen = json.load(f)

          assert discovery.get("discovery_end_date") == "2025-12-19", \
              discovery.get("discovery_end_date")

          assert frozen.get("discovery_end_date") == "2025-12-19", \
              frozen.get("discovery_end_date")

          print("Frozen verification passed.")
          PY

      - name: Verify interaction outputs
        run: |
          python - <<'PY'
          import json
          import csv
          from pathlib import Path

          root = Path("data/processed/ml/research/interaction")

          required = [
              root / "results.json",
              root / "results.csv",
              root / "interactions.csv",
          ]

          for path in required:
              if not path.exists():
                  raise SystemExit(f"Missing interaction output: {path}")

          with (root / "results.json").open() as f:
              data = json.load(f)

          assert data["target"] == "down_10pct_5d"
          assert data["discovery_end"] == "2025-12-19"
          assert data["bootstrap_iterations"] == 2000

          results = data["results"]

          si_only = [
              r for r in results
              if r["type"] == "si_only"
          ]

          vol_only = [
              r for r in results
              if r["type"] == "vol_only"
          ]

          interactions = [
              r for r in results
              if r["type"] == "si_x_vol"
          ]

          formal = data.get("formal_interactions", [])

          assert len(si_only) == 4, \
              f"Expected 4 SI-only rows, got {len(si_only)}"

          assert len(vol_only) == 4, \
              f"Expected 4 volatility-only rows, got {len(vol_only)}"

          assert len(interactions) == 16, \
              f"Expected 16 SI×VOL rows, got {len(interactions)}"

          assert len(formal) == 16, \
              f"Expected 16 formal interaction rows, got {len(formal)}"

          for row in formal:
              assert row["status"] == "ok", row

              required_fields = [
                  "si_tail",
                  "vol_tail",
                  "risk_11",
                  "risk_10",
                  "risk_01",
                  "risk_00",
                  "interaction_additive",
                  "interaction_additive_ci_low",
                  "interaction_additive_ci_high",
                  "interaction_multiplicative",
                  "return_interaction",
              ]

              for field in required_fields:
                  assert field in row, \
                      f"Missing {field} in {row}"

              assert (
                  row["interaction_additive_ci_low"]
                  <= row["interaction_additive_ci_high"]
              ), row

          print("Interaction verification passed.")
          print(f"SI-only rows: {len(si_only)}")
          print(f"Vol-only rows: {len(vol_only)}")
          print(f"SI×Vol rows: {len(interactions)}")
          print(f"Formal interaction rows: {len(formal)}")
          PY

      - name: Verify subgroup outputs
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("data/processed/ml/research")

          subgroup_files = list(
              root.rglob("*subgroup*.json")
          ) + list(
              root.rglob("*subgroup*.csv")
          )

          if subgroup_files:
              print("Subgroup outputs found:")
              for path in subgroup_files:
                  print(path)
          else:
              print("No separate subgroup files found; skipping.")

          print("Subgroup verification passed.")
          PY

      - name: Persist frozen research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/ml/research/discovery/ \
            data/processed/ml/research/frozen/ \
            data/processed/ml/research/interaction/

          if git diff --cached --quiet; then
            echo "No research result changes to commit."
            exit 0
          fi

          git commit -m "Update ML research results"
          git push
