name: Kontrollera feature returns

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-feature-returns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kör feature return diagnostik
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from datetime import date

          import pandas as pd


          ROOT = Path.cwd()

          EVENT_DIR = ROOT / "data" / "events"
          FEATURE_DIR = (
              ROOT
              / "data"
              / "processed"
              / "analysis"
          )
          PRICE_DIR = (
              ROOT
              / "data"
              / "raw"
              / "prices"
          )

          TARGETS = {
              "Fingerprint": {
                  "issuer": "Fingerprint Cards AB",
                  "event_date": "2023-11-24",
                  "isin": "SE0008374250",
                  "yahoo_symbol": "FING-B.ST",
              },
              "Viaplay": {
                  "issuer": "Viaplay Group AB (publ)",
                  "event_date": "2026-08-28",
                  "isin": "SE0012116390",
                  "yahoo_symbol": "VPLAY-B.ST",
              },
          }


          def normalize(value):
              if value is None:
                  return ""

              return str(value).strip().upper()


          def identity_keys(row):
              keys = []

              for field in (
                  "isin",
                  "lei",
                  "yahoo_symbol",
                  "issuer",
              ):
                  value = normalize(row.get(field))

                  if value:
                      keys.append(
                          (
                              field,
                              value,
                          )
                      )

              return keys


          def matches_identity(row, target):
              target_isin = normalize(
                  target["isin"]
              )
              target_symbol = normalize(
                  target["yahoo_symbol"]
              )
              target_issuer = normalize(
                  target["issuer"]
              )

              row_isin = normalize(
                  row.get("isin")
              )
              row_symbol = normalize(
                  row.get("yahoo_symbol")
              )
              row_issuer = normalize(
                  row.get("issuer")
              )

              if row_isin and row_isin == target_isin:
                  return True

              if row_symbol and row_symbol == target_symbol:
                  return True

              if row_issuer and row_issuer == target_issuer:
                  return True

              return False


          print("=" * 80)
          print("FEATURE RETURN DIAGNOSTIK")
          print("=" * 80)

          print()
          print("Repository:")
          print(ROOT)

          print()
          print("Event directory:")
          print(EVENT_DIR)

          event_files = sorted(
              EVENT_DIR.glob(
                  "short_events_*.jsonl"
              )
          )

          print(
              f"Hittade {len(event_files)} event-filer."
          )

          if not event_files:
              raise SystemExit(
                  "FAIL: inga event-filer hittades."
              )


          # ------------------------------------------------------------------
          # 1. Läs events
          # ------------------------------------------------------------------

          target_events = {
              name: []
              for name in TARGETS
          }

          for path in event_files:
              with path.open(
                  "r",
                  encoding="utf-8",
              ) as handle:

                  for line_number, line in enumerate(
                      handle,
                      start=1,
                  ):
                      line = line.strip()

                      if not line:
                          continue

                      try:
                          row = json.loads(line)
                      except json.JSONDecodeError:
                          continue

                      for name, target in TARGETS.items():
                          if matches_identity(
                              row,
                              target,
                          ):
                              target_events[name].append(
                                  {
                                      "path": path,
                                      "line": line_number,
                                      "row": row,
                                  }
                              )


          print()
          print("=" * 80)
          print("IDENTIFIERADE EVENTS")
          print("=" * 80)

          for name, events in target_events.items():
              print()
              print(f"--- {name} ---")

              if not events:
                  print("  EVENT SAKNAS")
                  continue

              seen = set()

              for item in events:
                  row = item["row"]

                  identity = (
                      row.get("event_date"),
                      row.get("isin"),
                      row.get("yahoo_symbol"),
                  )

                  if identity in seen:
                      continue

                  seen.add(identity)

                  print(
                      f"  {item['path'].relative_to(ROOT)}:"
                      f"{item['line']}"
                  )

                  print(
                      f"    issuer:        "
                      f"{row.get('issuer')}"
                  )

                  print(
                      f"    event_date:    "
                      f"{row.get('event_date')}"
                  )

                  print(
                      f"    yahoo_symbol:  "
                      f"{row.get('yahoo_symbol')}"
                  )

                  print(
                      f"    isin:          "
                      f"{row.get('isin')}"
                  )

                  print(
                      f"    lei:           "
                      f"{row.get('lei')}"
                  )


          # ------------------------------------------------------------------
          # 2. Indexera feature-dataset
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("INDEXERAR FEATURE-DATASET")
          print("=" * 80)

          feature_files = sorted(
              FEATURE_DIR.glob(
                  "features_*.jsonl"
              )
          )

          print(
              f"Hittade {len(feature_files)} feature-chunks."
          )

          if not feature_files:
              raise SystemExit(
                  "FAIL: inga feature-chunks hittades."
              )

          feature_index = {}

          for path in feature_files:
              with path.open(
                  "r",
                  encoding="utf-8",
              ) as handle:

                  for line_number, line in enumerate(
                      handle,
                      start=1,
                  ):
                      line = line.strip()

                      if not line:
                          continue

                      try:
                          row = json.loads(line)
                      except json.JSONDecodeError:
                          continue

                      snapshot_date = row.get(
                          "snapshot_date"
                      )

                      if not snapshot_date:
                          continue

                      for field, value in identity_keys(row):
                          key = (
                              str(snapshot_date)[:10],
                              field,
                              value,
                          )

                          feature_index.setdefault(
                              key,
                              [],
                          ).append(
                              {
                                  "path": path,
                                  "line": line_number,
                                  "row": row,
                              }
                          )


          # ------------------------------------------------------------------
          # 3. Hitta faktiska feature-rader
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("RESULTAT")
          print("=" * 80)

          failures = []

          matched_features = {}

          for name, target in TARGETS.items():
              print()
              print(f"### {name}")

              event_date = target["event_date"]

              candidates = []

              for field, value in (
                  identity_keys(target)
              ):
                  key = (
                      event_date,
                      field,
                      value,
                  )

                  candidates.extend(
                      feature_index.get(
                          key,
                          [],
                      )
                  )

              # Deduplicera samma feature-rad.
              unique = {}

              for item in candidates:
                  identity = (
                      str(item["path"]),
                      item["line"],
                  )

                  unique[identity] = item

              candidates = list(
                  unique.values()
              )

              if not candidates:
                  print(
                      f"  Event: {event_date} | "
                      f"{target['issuer']} | "
                      f"{target['yahoo_symbol']}"
                  )

                  print(
                      "  FEATURE MATCH: MISSING"
                  )

                  failures.append(
                      f"{name}: ingen feature-match "
                      f"för {event_date}"
                  )

                  continue

              # Förväntat är exakt en feature-rad.
              if len(candidates) > 1:
                  print(
                      f"  VARNING: {len(candidates)} "
                      "feature-rader matchade."
                  )

              item = candidates[0]
              row = item["row"]

              matched_features[name] = row

              print(
                  f"  Event: {event_date} | "
                  f"{target['issuer']} | "
                  f"{target['yahoo_symbol']}"
              )

              print(
                  "  FEATURE MATCH: OK"
              )

              print(
                  f"  feature file:              "
                  f"{item['path'].relative_to(ROOT)}:"
                  f"{item['line']}"
              )

              print(
                  f"  snapshot_date:             "
                  f"{row.get('snapshot_date')}"
              )

              print(
                  f"  price_date:                "
                  f"{row.get('price_date')}"
              )

              print(
                  f"  price_match_available:     "
                  f"{row.get('price_match_available')}"
              )

              print(
                  f"  yahoo_symbol:              "
                  f"{row.get('yahoo_symbol')}"
              )

              print(
                  f"  price_mapping_source:      "
                  f"{row.get('price_mapping_source')}"
              )

              print(
                  f"  close:                     "
                  f"{row.get('close')}"
              )

              print("  forward returns:")

              for horizon in (
                  1,
                  5,
                  20,
                  60,
              ):
                  print(
                      f"    forward_return_{horizon}d: "
                      f"{row.get(f'forward_return_{horizon}d')}"
                  )


          # ------------------------------------------------------------------
          # 4. Kontrollera själva prisarkivet
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("KONTROLL AV RÅ PRISDATA")
          print("=" * 80)

          price_files = sorted(
              PRICE_DIR.glob(
                  "prices_*.jsonl"
              )
          )

          print(
              f"Hittade {len(price_files)} prisfiler."
          )

          if not price_files:
              failures.append(
                  "Inga prices_*.jsonl hittades."
              )

          target_symbols = {
              target["yahoo_symbol"]
              for target in TARGETS.values()
          }

          price_rows = {
              symbol: []
              for symbol in target_symbols
          }

          for path in price_files:
              with path.open(
                  "r",
                  encoding="utf-8",
              ) as handle:

                  for line_number, line in enumerate(
                      handle,
                      start=1,
                  ):
                      line = line.strip()

                      if not line:
                          continue

                      try:
                          row = json.loads(line)
                      except json.JSONDecodeError:
                          continue

                      symbol = normalize(
                          row.get(
                              "yahoo_symbol"
                          )
                      )

                      if symbol not in target_symbols:
                          continue

                      price_rows[symbol].append(
                          {
                              "path": path,
                              "line": line_number,
                              "row": row,
                          }
                      )


          for name, target in TARGETS.items():
              print()
              print(f"### {name}")

              symbol = normalize(
                  target["yahoo_symbol"]
              )

              rows = price_rows.get(
                  symbol,
                  [],
              )

              print(
                  f"  symbol: {symbol}"
              )

              print(
                  f"  prisrader: {len(rows)}"
              )

              if not rows:
                  print(
                      "  PRICE SERIES: MISSING"
                  )

                  failures.append(
                      f"{name}: ingen prisserie "
                      f"för {symbol}"
                  )

                  continue

              dates = []

              for item in rows:
                  value = item["row"].get(
                      "date"
                  )

                  if value:
                      try:
                          dates.append(
                              pd.Timestamp(
                                  value
                              ).date()
                          )
                      except Exception:
                          pass

              if dates:
                  print(
                      f"  min_date: {min(dates)}"
                  )

                  print(
                      f"  max_date: {max(dates)}"
                  )

              # Kontrollera identiteten i prisraderna.
              identity_variants = set()

              for item in rows:
                  row = item["row"]

                  identity_variants.add(
                      (
                          row.get("isin"),
                          row.get("issuer"),
                      )
                  )

              print(
                  "  identitetsvarianter:"
              )

              for isin, issuer in sorted(
                  identity_variants,
                  key=lambda value: (
                      str(value[0]),
                      str(value[1]),
                  ),
              ):
                  print(
                      f"    isin={isin} | "
                      f"issuer={issuer}"
                  )

              # Datum runt eventet.
              event_date = pd.Timestamp(
                  target["event_date"]
              ).date()

              around = []

              for item in rows:
                  row = item["row"]

                  value = row.get(
                      "date"
                  )

                  if not value:
                      continue

                  try:
                      row_date = pd.Timestamp(
                          value
                      ).date()
                  except Exception:
                      continue

                  if (
                      abs(
                          (
                              row_date
                              - event_date
                          ).days
                      )
                      <= 7
                  ):
                      around.append(
                          item
                      )

              print()
              print(
                  f"  prisrader runt event "
                  f"{event_date}:"
              )

              if not around:
                  print(
                      "    INGA PRISRADER "
                      "INOM ±7 DAGAR"
                  )
              else:
                  for item in sorted(
                      around,
                      key=lambda item: item["row"].get(
                          "date",
                          "",
                      ),
                  ):
                      row = item["row"]

                      print(
                          f"    {row.get('date')} "
                          f"close={row.get('close')} "
                          f"isin={row.get('isin')} "
                          f"issuer={row.get('issuer')}"
                      )


          # ------------------------------------------------------------------
          # 5. Kontrollera feature → prisrelation
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("KONTROLL AV FEATURE → PRIS")
          print("=" * 80)

          for name, target in TARGETS.items():
              print()
              print(f"### {name}")

              row = matched_features.get(
                  name
              )

              if row is None:
                  print(
                      "  SKIP: feature saknas."
                  )
                  continue

              feature_price_date = row.get(
                  "price_date"
              )

              feature_symbol = normalize(
                  row.get(
                      "yahoo_symbol"
                  )
              )

              print(
                  f"  feature snapshot: "
                  f"{row.get('snapshot_date')}"
              )

              print(
                  f"  feature price_date: "
                  f"{feature_price_date}"
              )

              print(
                  f"  feature symbol: "
                  f"{feature_symbol}"
              )

              if (
                  feature_symbol
                  != normalize(
                      target["yahoo_symbol"]
                  )
              ):
                  failures.append(
                      f"{name}: feature yahoo_symbol "
                      f"är {feature_symbol}, "
                      f"förväntade "
                      f"{target['yahoo_symbol']}"
                  )

              if feature_price_date:
                  snapshot = pd.Timestamp(
                      row["snapshot_date"]
                  ).date()

                  price_date = pd.Timestamp(
                      feature_price_date
                  ).date()

                  if price_date < snapshot:
                      failures.append(
                          f"{name}: price_date "
                          f"{price_date} ligger före "
                          f"snapshot_date {snapshot}"
                      )

                  days = (
                      price_date - snapshot
                  ).days

                  print(
                      f"  dagar mellan FI och pris: "
                      f"{days}"
                  )

                  if days > 5:
                      print(
                          "  VARNING: prisdatum ligger "
                          "mer än 5 kalenderdagar efter "
                          "FI-datum."
                      )


          # ------------------------------------------------------------------
          # 6. Kontrollera forward-return-mognad
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("KONTROLL AV FORWARD-RETURN MOGNAD")
          print("=" * 80)

          today = date.today()

          for name, target in TARGETS.items():
              row = matched_features.get(
                  name
              )

              print()
              print(f"### {name}")

              if row is None:
                  print(
                      "  SKIP: feature saknas."
                  )
                  continue

              event_date = pd.Timestamp(
                  target["event_date"]
              ).date()

              age_days = (
                  today - event_date
              ).days

              print(
                  f"  event age: {age_days} kalenderdagar"
              )

              # Vi kräver inte 60d om eventet ännu
              # inte är 60 handelsdagar gammalt.
              #
              # Däremot ska 1d, 5d och 20d finnas när
              # tillräckligt många kalenderdagar gått.
              expected = []

              if age_days >= 5:
                  expected.extend(
                      [1, 5]
                  )

              if age_days >= 30:
                  expected.append(20)

              if age_days >= 90:
                  expected.append(60)

              for horizon in expected:
                  value = row.get(
                      f"forward_return_{horizon}d"
                  )

                  if value is None:
                      failures.append(
                          f"{name}: "
                          f"forward_return_{horizon}d "
                          "saknas trots att "
                          "eventet borde vara moget"
                      )

                      print(
                          f"  {horizon}d: MISSING"
                      )
                  else:
                      print(
                          f"  {horizon}d: OK "
                          f"({value})"
                      )


          # ------------------------------------------------------------------
          # 7. Eventdatum får inte ligga i framtiden
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("KONTROLL AV EVENTDATUM")
          print("=" * 80)

          for name, target in TARGETS.items():
              event_date = pd.Timestamp(
                  target["event_date"]
              ).date()

              print(
                  f"  {name}: "
                  f"{event_date}"
              )

              if event_date > today:
                  failures.append(
                      f"{name}: event_date "
                      f"{event_date} ligger i framtiden "
                      f"(idag {today})"
                  )


          # ------------------------------------------------------------------
          # 8. Slutsats
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("SLUTSTATUS")
          print("=" * 80)

          if failures:
              print("FAILURES:")

              for failure in failures:
                  print(
                      f"  - {failure}"
                  )

              raise SystemExit(1)

          print(
              "OK: inga diagnostiska fel hittades."
          )
          PY
