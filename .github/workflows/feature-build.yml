name: Build Features

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
      timezone: "Europe/Stockholm"

permissions:
  contents: write

concurrency:
  group: blankdiss-data-main
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  build:
    name: Bygg features
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build features
        run: |
          bash scripts/build_features.sh

      - name: Archive feature dataset
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-features-${{ github.run_id }}
          path: |
            data/processed/analysis/features_*.jsonl
            data/processed/analysis/features_metadata.json
            data/processed/analysis/fi_price_features.jsonl
            data/processed/analysis/fi_price_features_metadata.json
            data/processed/analysis/features_qc.json
          retention-days: 14
          if-no-files-found: error
