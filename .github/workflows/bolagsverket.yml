name: Blankdiss Bolagsverket

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Startdatum"
        required: true
        default: "2020-01-01"

      end:
        description: "Slutdatum"
        required: true
        default: "2020-06-30"

      max_archives:
        description: "Max antal ZIP-arkiv per körning"
        required: true
        default: "30"

permissions:
  contents: read

concurrency:
  group: bolagsverket-download
  cancel-in-progress: false

jobs:
  download:
    name: Hämta Bolagsverket
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Bolagsverket annual reports
        run: |
          python -u -m bolagsverket.download \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --max-archives "${{ inputs.max_archives }}" \
            --output data/bolagsverket

      - name: Inspect downloaded data
        run: |
          test -f data/bolagsverket/manifest.json

          find data/bolagsverket \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/bolagsverket/manifest.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          archives = data.get(
              "archives",
              []
          )

          if not archives:
              raise SystemExit(
                  "No Bolagsverket archives downloaded."
              )

          print(
              "Archives:",
              len(archives)
          )

          print(
              "Bytes:",
              sum(
                  int(item["bytes"])
                  for item in archives
              )
          )
          PY

      - name: Upload Bolagsverket data
        uses: actions/upload-artifact@v4
        with:
          name: bolagsverket-${{ inputs.start }}-${{ inputs.end }}
          path: data/bolagsverket
          if-no-files-found: error
          retention-days: 30
