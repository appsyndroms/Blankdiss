name: Build Sector Map
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-sector-map
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check input mapping
        run: |
          test -f data/analysis/instrument_map.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/analysis/instrument_map.json")
          with path.open(encoding="utf-8") as f:
              payload = json.load(f)
          if not isinstance(payload, dict):
              raise SystemExit(
                  "instrument_map.json måste innehålla ett JSON-objekt."
              )
          yahoo_symbols = {
              value.get("yahoo_symbol")
              for value in payload.values()
              if isinstance(value, dict)
              and value.get("yahoo_symbol")
          }
          print(
              f"Instrument i mapping: {len(payload)}"
          )
          print(
              f"Unika Yahoo-symboler: {len(yahoo_symbols)}"
          )
          if not yahoo_symbols:
              raise SystemExit(
                  "instrument_map.json innehåller inga Yahoo-symboler."
              )
          PY
      - name: Remove existing sector map
        run: |
          rm -f data/analysis/sector_map.json
      - name: Build sector map
        run: |
          python -u analysis/build_sector_map.py
      - name: Validate sector map
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          path = Path("data/analysis/sector_map.json")
          if not path.exists():
              raise SystemExit(
                  "sector_map.json skapades inte."
              )
          with path.open(encoding="utf-8") as f:
              payload = json.load(f)
          if not isinstance(payload, dict):
              raise SystemExit(
                  "sector_map.json måste innehålla ett JSON-objekt."
              )
          if payload.get("version") != 1:
              raise SystemExit(
                  f"Okänd sector map-version: {payload.get('version')}"
              )
          instruments = payload.get("instruments")
          if not isinstance(instruments, dict):
              raise SystemExit(
                  "sector_map.json saknar 'instruments'."
              )
          if not instruments:
              raise SystemExit(
                  "sector_map.json innehåller inga instrument."
              )
          missing_sector = []
          missing_industry = []
          for symbol, value in instruments.items():
              if not isinstance(value, dict):
                  missing_sector.append(symbol)
                  continue
              if not value.get("sector"):
                  missing_sector.append(symbol)
              if not value.get("industry"):
                  missing_industry.append(symbol)
          if missing_sector:
              preview = ", ".join(missing_sector[:10])
              raise SystemExit(
                  f"{len(missing_sector)} instrument saknar sektor. "
                  f"Exempel: {preview}"
              )
          sectors = Counter(
              value["sector"]
              for value in instruments.values()
              if isinstance(value, dict)
              and value.get("sector")
          )
          print(
              f"Sector map OK: {len(instruments)} instrument."
          )
          print(
              f"Instrument utan industry: "
              f"{len(missing_industry)}"
          )
          print()
          print("Sektorer:")
          for sector, count in sectors.most_common():
              print(
                  f"  {sector}: {count}"
              )
          PY
      - name: Upload sector map artifact
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-sector-map-${{ github.run_id }}
          if-no-files-found: error
          path: data/analysis/sector_map.json
