name: Blankdiss ML Experiments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-experiments-manual
  cancel-in-progress: false

jobs:
  experiments:
    name: Run Blankdiss experiments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run experiment manager
        run: |
          python -u -m ml.experiment_manager

      - name: Verify experiment results
        run: |
          test -f data/processed/experiments/latest/experiment_run.json

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-experiments
          path: |
            data/processed/experiments/latest/
            data/processed/experiments/runs/
          if-no-files-found: error
