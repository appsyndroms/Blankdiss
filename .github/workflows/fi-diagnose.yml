name: Diagnostisera FI-källa
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Diagnostisera FI HTML och resurser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Kör FI-diagnostik
        run: |
          python -m fi.diagnose | tee fi-diagnostic-output.txt
      - name: Ladda upp diagnostik
        uses: actions/upload-artifact@v4
        with:
          name: fi-diagnostic
          path: fi-diagnostic-output.txt
          if-no-files-found: error
          retention-days: 7
