name: Blankdiss Signal Backtest

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Blankdiss ML Training"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  signal-backtest:
    name: Kör signal backtest
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # Features
      #
      # TODO:
      # När artifact-lineage är hårdnad ska detta hämta exakt
      # det feature-artifact som ML Training använde.
      #
      # Tills dess används senaste lyckade Features QC.
      # ---------------------------------------------------------
      - name: Download latest successful Features QC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf data/processed/analysis
          mkdir -p data/processed/analysis

          RUN_ID="$(
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow "features-qc.yml" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"

          if [ -z "$RUN_ID" ]; then
            echo "Ingen lyckad Features QC-körning hittades."
            exit 1
          fi

          echo "Hämtar Features QC run: $RUN_ID"

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name features-and-qc \
            --dir data/processed/analysis

      # ---------------------------------------------------------
      # Verify features
      # ---------------------------------------------------------
      - name: Verify feature dataset
        run: |
          test -f data/processed/analysis/features.jsonl
          test -f data/processed/analysis/features_metadata.json

          echo "Feature-dataset finns."
          echo
          echo "Feature-filer:"
          ls -lh data/processed/analysis/

      # ---------------------------------------------------------
      # Verify signal backtest package
      # ---------------------------------------------------------
      - name: Verify signal backtest package
        run: |
          test -f analysis/signal_backtest/__init__.py
          test -f analysis/signal_backtest/__main__.py
          test -f analysis/signal_backtest/config.py
          test -f analysis/signal_backtest/metrics.py
          test -f analysis/signal_backtest/reporting.py
          test -f analysis/signal_backtest/runner.py

          echo "Signal backtest-paket finns."

      # ---------------------------------------------------------
      # Run signal backtest
      #
      # Den här körningen skriver redan ut hela resultatet.
      # Därför behövs inget separat Python-summary-steg.
      # ---------------------------------------------------------
      - name: Run signal backtest
        run: |
          python -m analysis.signal_backtest

      # ---------------------------------------------------------
      # Verify result
      # ---------------------------------------------------------
      - name: Verify signal backtest result
        run: |
          test -f data/processed/ml/signal_backtest.json

          echo
          echo "================================"
          echo "SIGNAL BACKTEST KLAR"
          echo "================================"
          echo "Resultat:"
          ls -lh data/processed/ml/signal_backtest.json

      # ---------------------------------------------------------
      # Upload result
      # ---------------------------------------------------------
      - name: Upload signal backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-backtest-results
          path: data/processed/ml/signal_backtest.json
          if-no-files-found: error
