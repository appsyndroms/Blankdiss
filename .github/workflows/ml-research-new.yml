name: ML Research

on:
  workflow_dispatch:
    inputs:
      spec:
        description: >
          Research spec att köra. Lämna tomt för att köra alla specs
          i ml/research/specs/.
        required: false
        type: string
        default: ""

      diagnostic:
        description: >
          Diagnostic experiment att köra. Lämna tomt för vanlig
          declarative research.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  research:
    name: Run ML research
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show research configuration
        run: |
          echo "Research architecture: declarative"
          echo "Spec input: '${{ inputs.spec }}'"
          echo "Diagnostic input: '${{ inputs.diagnostic }}'"

      - name: Run diagnostic
        if: ${{ inputs.diagnostic != '' }}
        run: |
          echo "Diagnostic input is currently reserved for registered"
          echo "diagnostic experiments."
          echo "Requested diagnostic: '${{ inputs.diagnostic }}'"

          case "${{ inputs.diagnostic }}" in
            *)
              echo "Unknown diagnostic: '${{ inputs.diagnostic }}'"
              exit 1
              ;;
          esac

      - name: Run all research specs
        if: ${{ inputs.diagnostic == '' && inputs.spec == '' }}
        run: |
          python -u -m ml.research.runner

      - name: Run selected research spec
        if: ${{ inputs.diagnostic == '' && inputs.spec != '' }}
        run: |
          python -u -m ml.research.runner "${{ inputs.spec }}"

      - name: List research results
        if: always()
        run: |
          echo "Research output:"
          find data/processed/ml/research \
            -maxdepth 4 \
            -type f \
            -print 2>/dev/null || true

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-research-${{ github.run_id }}
          path: |
            data/processed/ml/research/**
          if-no-files-found: warn
          retention-days: 30
