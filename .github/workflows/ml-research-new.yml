name: AI-lab research

on:
  workflow_dispatch:
    inputs:
      ai_lab:
        description: >
          AI Lab experiment-spec som JSON.
        required: true
        type: string

permissions:
  contents: write

jobs:
  blankdiss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # AI LAB
      # ============================================================

      - name: Run AI Lab experiment
        env:
          AI_LAB_SPEC: ${{ inputs.ai_lab }}
        run: |
          echo "=== AI LAB INPUT ==="
          printf '%s\n' "$AI_LAB_SPEC"
          echo "===================="

          mkdir -p data/ai_lab/inbox
          mkdir -p data/ai_lab/results

          printf '%s\n' "$AI_LAB_SPEC" \
            > data/ai_lab/inbox/experiment.json

          echo "=== EXPERIMENT FILE ==="
          cat data/ai_lab/inbox/experiment.json
          echo "======================="

          echo "=== RUNNING AI LAB ==="
          python -u ml/ai-lab/ai_lab_runner.py \
            data/ai_lab/inbox/experiment.json

      # ============================================================
      # AI LAB RESULTS
      # ============================================================

      - name: Show AI Lab results
        if: always()
        run: |
          echo "=== AI LAB RESULTS ==="

          if [ -d data/ai_lab/results ]; then
            find data/ai_lab/results -maxdepth 3 -type f -print
          else
            echo "No results directory found."
          fi

          echo "======================"

      # ============================================================
      # COMMIT GENERATED DATA
      # ============================================================

      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ai_lab/

          if git diff --cached --quiet; then
            echo "No AI Lab changes to commit."
            exit 0
          fi

          git commit -m "Run AI Lab experiment"
          git push origin HEAD:main
