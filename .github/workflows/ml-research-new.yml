name: AI-lab research

on:
  workflow_dispatch:

concurrency:
  group: ai-lab-research-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  blankdiss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # AI LAB
      #
      # Workflowet startar bara forskningsmotorn.
      # Forskningslogiken ligger i adaptive_research.py.
      # ============================================================

      - name: Run autonomous AI Lab research
        run: |
          echo "=== START AI LAB RESEARCH ==="

          python -u ml/ai-lab/adaptive_research.py

          echo "=== AI LAB RESEARCH FINISHED ==="

      # ============================================================
      # SHOW RESULTS
      # ============================================================

      - name: Show AI Lab research state
        if: always()
        run: |
          echo "=== AI LAB STATE ==="

          if [ -f data/ai_lab/adaptive_research/state.json ]; then
            cat data/ai_lab/adaptive_research/state.json
          else
            echo "No adaptive research state found."
          fi

          echo "===================="

      - name: Show generated research artifacts
        if: always()
        run: |
          echo "=== GENERATED ADAPTIVE SPECS ==="

          if [ -d ml/research/specs ]; then
            find ml/research/specs \
              -maxdepth 1 \
              -type f \
              -name 'adaptive_*.yaml' \
              -print
          else
            echo "No research specs directory found."
          fi

          echo "=== GENERATED EXPERIMENT CODE ==="

          if [ -d ml/research/discovery ]; then
            find ml/research/discovery \
              -maxdepth 1 \
              -type f \
              -name 'adaptive_*.py' \
              -print
          else
            echo "No discovery directory found."
          fi

          echo "=== RESEARCH RESULTS ==="

          if [ -d data/processed/ml/research/spec_runs ]; then
            find data/processed/ml/research/spec_runs \
              -maxdepth 2 \
              -type f \
              -print
          else
            echo "No research results directory found."
          fi

          echo "========================"

      # ============================================================
      # COMMIT GENERATED DATA / SPECS / CODE
      # ============================================================

      - name: Commit generated research artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/ai_lab/adaptive_research/ \
            data/processed/ml/research/spec_runs/ \
            ml/research/specs/adaptive_*.yaml \
            ml/research/discovery/adaptive_*.py

          if git diff --cached --quiet; then
            echo "No AI Lab research changes to commit."
            exit 0
          fi

          git commit \
            -m "Run autonomous AI Lab research"

          for attempt in 1 2 3; do
            echo "Syncing with origin/main..."

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded."
                exit 0
              fi
            else
              echo "Rebase failed; aborting rebase."
              git rebase --abort || true
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "Failed to push generated research artifacts after 3 attempts."
          exit 1
