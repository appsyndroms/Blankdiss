name: ML Research New

on:
  workflow_dispatch:
    inputs:
      spec:
        description: >
          Research spec att köra. Lämna tomt för att köra alla specs i
          ml/research/specs/.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  research:
    name: Run declarative research
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show research configuration
        run: |
          echo "Research architecture: declarative"
          echo "Spec input: '${{ inputs.spec }}'"

      - name: Run all research specs
        if: ${{ inputs.spec == '' }}
        run: |
          python -u -m ml.research.runner

      - name: Run selected research spec
        if: ${{ inputs.spec != '' }}
        run: |
          python -u -m ml.research.runner "${{ inputs.spec }}"

      - name: List research results
        if: always()
        run: |
          echo "Research output:"
          find data/processed/ml/research/spec_runs \
            -maxdepth 3 \
            -type f \
            -print 2>/dev/null || true

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-research-new-${{ github.run_id }}
          path: |
            data/processed/ml/research/spec_runs/**
          if-no-files-found: warn
          retention-days: 30
