name: Blankdiss

on:
  workflow_dispatch:
    inputs:
      ai_lab:
        description: >
          AI Lab experiment-spec som JSON. Lämna tomt för normalt Blankdiss-flöde.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  blankdiss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # AI LAB
      # ============================================================

      - name: Run AI Lab experiment
        if: ${{ inputs.ai_lab != '' }}
        env:
          AI_LAB_SPEC: ${{ inputs.ai_lab }}
        run: |
          mkdir -p data/ai_lab/inbox
          mkdir -p data/ai_lab/results

          printf '%s\n' "$AI_LAB_SPEC" \
            > data/ai_lab/inbox/experiment.json

          python -u -m ml.research.ai_lab_runner \
            data/ai_lab/inbox/experiment.json

      # ============================================================
      # BEFINTLIGA BLANKDISS-STEG
      # ============================================================

      # ... alla befintliga steg i blankdiss.yml ligger kvar här ...
      #
      # Viktigt:
      # AI Lab-steget ska inte ersätta den befintliga körningen.
      # Det är ett extra läge.

      # ============================================================
      # COMMIT GENERATED DATA
      # ============================================================

      - name: Commit generated data
        if: always() && inputs.ai_lab != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ai_lab/

          if git diff --cached --quiet; then
            echo "No AI Lab changes to commit."
            exit 0
          fi

          git commit -m "Run AI Lab experiment"
          git push origin HEAD:main
