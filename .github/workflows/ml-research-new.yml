name: AI-lab research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blankdiss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # AI LAB
      # ============================================================

      - name: Run AI Lab research state
        run: |
          mkdir -p data/ai_lab/inbox
          mkdir -p data/ai_lab/results

          cat > data/ai_lab/inbox/experiment.json <<'EOF'
          {
            "experiment_id": "research_state_snapshot",
            "description": "Read-only snapshot of the current Blankdiss research state for AI Lab reasoning.",
            "experiment": "research_state"
          }
          EOF

          echo "=== AI LAB EXPERIMENT ==="
          cat data/ai_lab/inbox/experiment.json
          echo "========================="

          python -u ml/ai-lab/ai_lab_runner.py \
            data/ai_lab/inbox/experiment.json

      # ============================================================
      # AI LAB PLANNER
      # ============================================================

      - name: Run AI Lab experiment planner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path(
              "data/ai_lab/results/research_state_snapshot/results.json"
          )

          with source.open(
              "r",
              encoding="utf-8",
          ) as handle:
              payload = json.load(handle)

          execution = payload.get(
              "execution",
              {},
          )

          research_state = execution.get(
              "result"
          )

          if not isinstance(
              research_state,
              dict,
          ):
              raise ValueError(
                  "research_state_snapshot does not contain "
                  "a valid execution.result object."
              )

          planner_spec = {
              "experiment_id": "experiment_planner",
              "description": (
                  "Controlled experiment proposal generated "
                  "from the current Blankdiss research state."
              ),
              "experiment": "experiment_planner",
              "research_state": research_state,
          }

          output = Path(
              "data/ai_lab/inbox/experiment_planner.json"
          )

          with output.open(
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(
                  planner_spec,
                  handle,
                  indent=2,
                  ensure_ascii=False,
              )
              handle.write("\n")
          PY

          echo "=== AI LAB EXPERIMENT PLANNER ==="
          cat data/ai_lab/inbox/experiment_planner.json
          echo "================================="

          python -u ml/ai-lab/ai_lab_runner.py \
            data/ai_lab/inbox/experiment_planner.json

      # ============================================================
      # SHOW RESULTS
      # ============================================================

      - name: Show AI Lab results
        if: always()
        run: |
          echo "=== AI LAB RESULTS ==="

          if [ -d data/ai_lab/results ]; then
            find data/ai_lab/results -maxdepth 3 -type f -print
          else
            echo "No results directory found."
          fi

          echo "======================"

      # ============================================================
      # COMMIT GENERATED DATA
      # ============================================================

      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ai_lab/

          if git diff --cached --quiet; then
            echo "No AI Lab changes to commit."
            exit 0
          fi

          git commit -m "Run AI Lab research planner"
          git push origin HEAD:main
