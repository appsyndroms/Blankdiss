name: AI-lab research

on:
  workflow_dispatch:

# Prevent two AI Lab runs from committing to main at the same time.
concurrency:
  group: ai-lab-research-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  blankdiss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # AI LAB
      # ============================================================

      - name: Run AI Lab research state
        run: |
          mkdir -p data/ai_lab/inbox
          mkdir -p data/ai_lab/results

          cat > data/ai_lab/inbox/experiment.json <<'EOF'
          {
            "experiment_id": "research_state_snapshot",
            "description": "Read-only snapshot of the current Blankdiss research state for AI Lab reasoning.",
            "experiment": "research_state"
          }
          EOF

          echo "=== AI LAB EXPERIMENT ==="
          cat data/ai_lab/inbox/experiment.json
          echo "========================="

          python -u ml/ai-lab/ai_lab_runner.py \
            data/ai_lab/inbox/experiment.json

      # ============================================================
      # AI LAB PLANNER
      # ============================================================

      - name: Run AI Lab experiment planner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path(
              "data/ai_lab/results/research_state_snapshot/results.json"
          )

          with source.open(
              "r",
              encoding="utf-8",
          ) as handle:
              payload = json.load(handle)

          execution = payload.get(
              "execution",
              {},
          )

          research_state = execution.get(
              "result"
          )

          if not isinstance(
              research_state,
              dict,
          ):
              raise ValueError(
                  "research_state_snapshot does not contain "
                  "a valid execution.result object."
              )

          planner_spec = {
              "experiment_id": "experiment_planner",
              "description": (
                  "Controlled experiment proposal generated "
                  "from the current Blankdiss research state."
              ),
              "experiment": "experiment_planner",
              "research_state": research_state,
          }

          output = Path(
              "data/ai_lab/inbox/experiment_planner.json"
          )

          with output.open(
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(
                  planner_spec,
                  handle,
                  indent=2,
                  ensure_ascii=False,
              )
              handle.write("\n")
          PY

          echo "=== AI LAB EXPERIMENT PLANNER ==="
          cat data/ai_lab/inbox/experiment_planner.json
          echo "================================="

          python -u ml/ai-lab/ai_lab_runner.py \
            data/ai_lab/inbox/experiment_planner.json

      # ============================================================
      # EXECUTE PLANNER PROPOSAL
      # ============================================================

      - name: Execute selected research proposal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path(
              "data/ai_lab/results/experiment_planner/results.json"
          )

          with source.open(
              "r",
              encoding="utf-8",
          ) as handle:
              payload = json.load(handle)

          execution = payload.get(
              "execution",
              {},
          )

          result = execution.get(
              "result",
              {},
          )

          if result.get(
              "status"
          ) != "proposal_created":
              raise SystemExit(
                  "AI Lab planner did not create "
                  "an executable proposal."
              )

          selection = result.get(
              "selection",
              {},
          )

          spec_id = selection.get(
              "source_spec"
          )

          stage = selection.get(
              "stage"
          )

          locked = selection.get(
              "locked"
          )

          if not spec_id:
              raise ValueError(
                  "Planner proposal has no source_spec."
              )

          if locked is True:
              raise ValueError(
                  "Refusing to execute a locked "
                  "research specification."
              )

          if stage == "migration":
              raise ValueError(
                  "Refusing to execute a migration "
                  "specification."
              )

          spec_path = (
              Path("ml/research/specs")
              / f"{spec_id}.yaml"
          )

          if not spec_path.exists():
              raise FileNotFoundError(
                  f"Planner selected missing spec: "
                  f"{spec_path}"
              )

          print(
              f"Executing planner proposal: {spec_id}"
          )
          print(
              f"Stage: {stage}"
          )
          print(
              f"Spec: {spec_path}"
          )
          PY

          SPEC_ID=$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/ai_lab/results/experiment_planner/results.json"
          )

          with path.open(
              "r",
              encoding="utf-8",
          ) as handle:
              payload = json.load(handle)

          print(
              payload[
                  "execution"
              ][
                  "result"
              ][
                  "selection"
              ][
                  "source_spec"
              ]
          )
          PY
          )

          PYTHONPATH=. python -u ml/research/runner.py \
            "ml/research/specs/${SPEC_ID}.yaml"

      # ============================================================
      # SHOW RESULTS
      # ============================================================

      - name: Show AI Lab results
        if: always()
        run: |
          echo "=== AI LAB RESULTS ==="

          if [ -d data/ai_lab/results ]; then
            find data/ai_lab/results -maxdepth 3 -type f -print
          else
            echo "No results directory found."
          fi

          echo "=== RESEARCH ENGINE RESULTS ==="

          if [ -d data/processed/ml/research/spec_runs ]; then
            find data/processed/ml/research/spec_runs -maxdepth 2 -type f -print
          else
            echo "No research engine results directory found."
          fi

          echo "======================"

      # ============================================================
      # COMMIT GENERATED DATA
      # ============================================================

      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ai_lab/

          if [ -d data/processed/ml/research/spec_runs ]; then
            git add data/processed/ml/research/spec_runs/
          fi

          if git diff --cached --quiet; then
            echo "No AI Lab or research changes to commit."
            exit 0
          fi

          git commit -m "Run AI Lab research planner"

          # The remote main branch may have moved after checkout.
          # Rebase onto the latest main before pushing, with retries
          # for a possible external push racing this workflow.
          for attempt in 1 2 3; do
            echo "Syncing with origin/main..."
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded."
                exit 0
              fi
            else
              echo "Rebase failed; aborting rebase."
              git rebase --abort || true
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "Failed to push generated data after 3 attempts."
          exit 1
