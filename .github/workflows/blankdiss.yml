name: Blankdiss

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
      timezone: "Europe/Stockholm"
    - cron: "15 18 * * *"
      timezone: "Europe/Stockholm"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blankdiss-data-main
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  build:
    name: Bygg Blankdiss
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch FI aggregate
        run: |
          python -u -m fi

      - name: Fetch prices
        run: |
          python -m prices --start 2022-01-01

      - name: Update OMXSPI
        run: |
          python -m analysis.update_market
