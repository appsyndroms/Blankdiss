name: Pris historisk data - QC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc-price-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kontrollera underlag
        run: |
          test -f data/processed/fi/aggregate/reconstructed.jsonl
          test -f data/analysis/instrument_map.json
          test -d data/raw/prices

      - name: Kör price QC
        run: |
          python -m prices.qc

      - name: Spara QC-rapport som artifact
        uses: actions/upload-artifact@v7
        with:
          name: price-qc
          path: |
            data/raw/prices/price_qc.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
