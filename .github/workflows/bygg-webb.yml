name: Bygg webb
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bygg-webb
  cancel-in-progress: false
jobs:
  build:
    name: Bygg webb från befintlig data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build web
        run: |
          python web_build.py
      - name: Verify generated website
        run: |
          test -f pages/index.html
          test -f pages/koplage.html
          test -f pages/bedomning.html
          test -f pages/dataanalys.html
          test -f pages/style.css
          test -f pages/data.json
          echo "Webb byggd:"
          ls -lh pages/
      - name: Upload generated website
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-web-${{ github.run_id }}
          if-no-files-found: error
          path: pages/
      - name: Persist generated website
        run: |
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/
          if git diff --cached --quiet; then
            echo "Webbplatsen är oförändrad."
            exit 0
          fi
          git commit \
            -m "Build website"
          git push
