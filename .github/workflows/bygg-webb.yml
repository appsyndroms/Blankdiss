name: Bygg webb

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bygg-webb
  cancel-in-progress: false

jobs:
  build:
    name: Bygg webb från befintlig data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build web
        run: |
          python web_build.py

      - name: Verify generated website
        run: |
          test -f pages/index.html
          test -f pages/koplage.html
          test -f pages/bedomning.html
          test -f pages/dataanalys.html
          test -f pages/style.css
          test -f pages/data.json

          echo "Webb byggd:"
          ls -lh pages/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

  deploy:
    name: Publicera webb
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
