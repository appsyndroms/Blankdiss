name: Bygg webb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bygg-webb
  cancel-in-progress: false

jobs:
  build:
    name: Bygg webb från befintlig data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build web
        run: |
          python web_build.py

      - name: Verify generated website
        run: |
          test -f pages/index.html
          test -f pages/koplage.html
          test -f pages/bedomning.html
          test -f pages/dataanalys.html
          test -f pages/style.css
          test -f pages/data.json

          echo "Webb byggd:"
          ls -lh pages/

      - name: Upload generated website
        uses: actions/upload-artifact@v4
        with:
          name: blankdiss-web-${{ github.run_id }}
          if-no-files-found: error
          path: pages/
