name: FI historisk data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-fi-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hämta en historisk FI-fil
        run: |
          python -m fi.backfill \
            --from 2022-05-25 \
            --to 2022-05-25

      - name: Visa hämtad data
        run: |
          echo "Historiska FI-filer:"
          find data/raw/fi/aggregate/historical \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      - name: Kontrollera Git-status
        run: |
          echo "Git-status för historiska FI-filer:"
          git status --short -- data/raw/fi/aggregate/historical

          echo "Ignorerade filer i historikkatalogen:"
          git status --short --ignored -- data/raw/fi/aggregate/historical

      - name: Commit historisk data
        run: |
          if [ -z "$(git status --porcelain -- data/raw/fi/aggregate/historical)" ]; then
            echo "Ingen ny historisk data att committa."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/fi/aggregate/historical
          git commit -m "Add FI historical aggregate data"
          git push
