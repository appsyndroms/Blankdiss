name: FI historisk data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-fi-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hämta verifierade historiska FI-aggregat
        run: |
          python -m fi.backfill \
            --from 2022-05-25 \
            --to 2022-06-08

      - name: Hämta hela FI:s historiska positionsregister
        run: |
          python -m fi.historical_positions

      - name: Visa historiska FI-data
        run: |
          echo "=========================================="
          echo "HISTORISKA AGGREGAT"
          echo "=========================================="

          find data/raw/fi/aggregate/historical \
            -maxdepth 1 \
            -type f \
            -name 'fi_aggregate_*.jsonl' \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "HISTORISKA POSITIONER"
          echo "=========================================="

          find data/raw/fi/positions/historical \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "METADATA"
          echo "=========================================="

          if [ -f data/raw/fi/positions/historical/fi_historical_positions_metadata.json ]; then
            cat \
              data/raw/fi/positions/historical/fi_historical_positions_metadata.json
          fi

      - name: Kontrollera Git-status
        run: |
          echo "Git-status för historiska FI-data:"
          git status --short \
            -- data/raw/fi/aggregate/historical \
            data/raw/fi/positions/historical

      - name: Commit historisk data
        run: |
          if [ -z "$(git status --porcelain -- \
            data/raw/fi/aggregate/historical \
            data/raw/fi/positions/historical)" ]; then
            echo "Ingen ny historisk data att committa."
            exit 0
          fi

          echo "Historisk data hittad:"
          git status --short \
            -- data/raw/fi/aggregate/historical \
            data/raw/fi/positions/historical

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/raw/fi/aggregate/historical \
            data/raw/fi/positions/historical

          echo
          echo "Filer som kommer att committas:"
          git diff --cached --name-status

          git commit \
            -m "Add FI historical short positions"

          git push
