name: FI historisk data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-fi-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hämta verifierad FI-aggregathistorik
        run: |
          python -m fi.backfill \
            --from 2022-05-25

      - name: Hämta hela FI:s historiska positionsregister
        run: |
          python -m fi.historical_positions

      - name: Rekonstruera aggregerad historik
        run: |
          python -m fi.reconstruct_aggregate

      - name: Visa historiska FI-data
        run: |
          echo "=========================================="
          echo "OFFICIELLA HISTORISKA AGGREGAT"
          echo "=========================================="

          find data/raw/fi/aggregate/historical \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "REKONSTRUERAT AGGREGAT"
          echo "=========================================="

          find data/processed/fi/aggregate \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "HISTORISKA POSITIONER"
          echo "=========================================="

          find data/raw/fi/positions/historical \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "REKONSTRUKTION METADATA"
          echo "=========================================="

          cat \
            data/processed/fi/aggregate/reconstructed_metadata.json

          echo
          echo "=========================================="
          echo "FI POSITION METADATA"
          echo "=========================================="

          cat \
            data/raw/fi/positions/historical/fi_historical_positions_metadata.json

      - name: Kontrollera storlek på genererade data
        run: |
          echo "=========================================="
          echo "GENERERADE DATASTORLEKAR"
          echo "=========================================="

          du -sh \
            data/raw/fi/aggregate/historical \
            data/raw/fi/positions/historical \
            data/processed/fi/aggregate \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "STÖRSTA GENERERADE FILER"
          echo "=========================================="

          find \
            data/raw/fi/aggregate/historical \
            data/raw/fi/positions/historical \
            data/processed/fi/aggregate \
            -type f \
            -printf '%s %p\n' \
            | sort -nr \
            | head -20

      - name: Spara stora FI-data som artifact
        uses: actions/upload-artifact@v7
        with:
          name: fi-historical-data
          path: |
            data/raw/fi/aggregate/historical/**/*.jsonl
            data/raw/fi/positions/historical/**/*.jsonl
            data/processed/fi/aggregate/**/*.jsonl
            data/raw/fi/positions/historical/*_metadata.json
            data/processed/fi/aggregate/*_metadata.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Kontrollera Git-status
        run: |
          echo "Git-status för metadata:"

          git status --short \
            -- \
            data/raw/fi/positions/historical \
            data/processed/fi/aggregate

      - name: Commit metadata
        run: |
          if [ -z "$(git status --porcelain -- \
            data/raw/fi/positions/historical \
            data/processed/fi/aggregate)" ]; then

            echo "Ingen ny metadata att committa."
            exit 0
          fi

          echo "Metadata hittad:"

          git status --short \
            -- \
            data/raw/fi/positions/historical \
            data/processed/fi/aggregate

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/raw/fi/positions/historical/*_metadata.json \
            data/processed/fi/aggregate/*_metadata.json

          if git diff --cached --quiet; then
            echo "Ingen metadata att committa."
            exit 0
          fi

          echo
          echo "Filer som kommer att committas:"

          git diff --cached --name-status

          git commit \
            -m "Update FI historical metadata"

          git push
