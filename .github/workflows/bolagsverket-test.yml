- name: Test Bolagsverket API
  env:
    BOLAGSVERKET_CLIENT_ID: ${{ secrets.BOLAGSVERKET_CLIENT_ID_TEST }}
    BOLAGSVERKET_CLIENT_SECRET: ${{ secrets.BOLAGSVERKET_CLIENT_SECRET_TEST }}
  run: |
    python - <<'PY'
    import os
    import requests

    token_url = "https://portal-accept2.api.bolagsverket.se/oauth2/token"
    api_url = "https://gw-accept2.api.bolagsverket.se/foretagsinformation/v4/organisationer"

    token_response = requests.post(
        token_url,
        data={"grant_type": "client_credentials"},
        auth=(
            os.environ["BOLAGSVERKET_CLIENT_ID"],
            os.environ["BOLAGSVERKET_CLIENT_SECRET"],
        ),
        timeout=30,
    )

    token_response.raise_for_status()
    token = token_response.json()["access_token"]

    response = requests.get(
        api_url,
        headers={
            "Authorization": f"Bearer {token}",
            "Accept": "application/json",
        },
        timeout=30,
    )

    print(f"API HTTP status: {response.status_code}")
    print(response.text[:5000])
    PY
