name: Bolagsverket API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Test Bolagsverket TEST API
        env:
          BOLAGSVERKET_CLIENT_ID: ${{ secrets.BOLAGSVERKET_CLIENT_ID_TEST }}
          BOLAGSVERKET_CLIENT_SECRET: ${{ secrets.BOLAGSVERKET_CLIENT_SECRET_TEST }}
        run: |
          python - <<'PY'
          import os
          import uuid
          import requests

          TOKEN_URL = (
              "https://portal-accept2.api.bolagsverket.se/oauth2/token"
          )

          API_URL = (
              "https://gw-accept2.api.bolagsverket.se/"
              "foretagsinformation/v4/organisationer"
          )

          print("Environment: TEST / ACCEPT2")
          print("API: VärdefullaDatamängder")
          print()

          # ------------------------------------------------------------
          # OAuth
          # ------------------------------------------------------------

          token_response = requests.post(
              TOKEN_URL,
              data={
                  "grant_type": "client_credentials",
              },
              auth=(
                  os.environ["BOLAGSVERKET_CLIENT_ID"],
                  os.environ["BOLAGSVERKET_CLIENT_SECRET"],
              ),
              timeout=30,
          )

          print(f"OAuth HTTP status: {token_response.status_code}")

          token_response.raise_for_status()

          token_data = token_response.json()
          token = token_data["access_token"]

          print("OAuth: OK")
          print(f"Token type: {token_data.get('token_type')}")
          print(f"Expires in: {token_data.get('expires_in')} seconds")

          # ------------------------------------------------------------
          # API
          # ------------------------------------------------------------

          request_id = str(uuid.uuid4())

          payload = {
              "identitetsbeteckning": "5299999994"
          }

          print()
          print(f"X-Request-Id: {request_id}")
          print("Calling organisation API...")

          response = requests.post(
              API_URL,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "X-Request-Id": request_id,
              },
              json=payload,
              timeout=30,
          )

          print()
          print(f"API HTTP status: {response.status_code}")
          print("API response:")
          print(response.text[:10000])

          if response.status_code == 403:
              print()
              print("ERROR: API subscription/authorization failed.")
              print("OAuth succeeded, but the TEST client is not authorized")
              print("for this API resource in the TEST environment.")
              raise SystemExit(2)

          response.raise_for_status()

          print()
          print("Bolagsverket TEST API: OK")
          PY
