name: Undersök FI historiska positioner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Hämta och analysera FI:s historiska fil
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install odfpy

      - name: Hämta och analysera historisk FI-fil
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          import pandas as pd
          import requests


          URL = (
              "https://www.fi.se/"
              "BlankningsRegister/"
              "GetHistFile"
          )

          OUTPUT = Path("fi-historical.ods")
          REPORT = Path("fi-history-report.txt")

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; Blankdiss/1.0)"
              ),
              "Accept": (
                  "application/vnd.oasis."
                  "opendocument.spreadsheet,"
                  "application/octet-stream,"
                  "*/*"
              ),
          }


          def write(
              file,
              text: str = "",
          ) -> None:
              print(text)
              file.write(text + "\n")


          def find_column(
              columns: list[str],
              *terms: tuple[str, ...],
          ) -> str | None:
              for term_group in terms:
                  for column in columns:
                      lowered = str(column).lower()

                      if all(
                          term in lowered
                          for term in term_group
                      ):
                          return str(column)

              return None


          with REPORT.open(
              "w",
              encoding="utf-8",
          ) as report:

              write(
                  report,
                  "=" * 72,
              )
              write(
                  report,
                  "FI HISTORISK FIL",
              )
              write(
                  report,
                  "=" * 72,
              )
              write(
                  report,
                  f"URL: {URL}",
              )

              response = requests.get(
                  URL,
                  headers=HEADERS,
                  timeout=60,
              )

              write(
                  report,
                  f"HTTP: {response.status_code}",
              )
              write(
                  report,
                  "Content-Type: "
                  f"{response.headers.get('Content-Type')}",
              )
              write(
                  report,
                  "Content-Length: "
                  f"{response.headers.get('Content-Length')}",
              )
              write(
                  report,
                  "Content-Disposition: "
                  f"{response.headers.get('Content-Disposition')}",
              )
              write(
                  report,
                  f"Bytes: {len(response.content)}",
              )

              response.raise_for_status()

              OUTPUT.write_bytes(
                  response.content
              )

              write(
                  report,
                  f"Sparad: {OUTPUT}",
              )

              workbook = pd.ExcelFile(
                  OUTPUT,
                  engine="odf",
              )

              write(
                  report,
              )
              write(
                  report,
                  "=" * 72,
              )
              write(
                  report,
                  "FILANALYS",
              )
              write(
                  report,
                  "=" * 72,
              )

              write(
                  report,
                  "Antal blad: "
                  f"{len(workbook.sheet_names)}",
              )

              for sheet_name in (
                  workbook.sheet_names
              ):
                  write(
                      report,
                      f"- {sheet_name}",
                  )

              for sheet_name in (
                  workbook.sheet_names
              ):
                  write(
                      report,
                  )
                  write(
                      report,
                      "=" * 72,
                  )
                  write(
                      report,
                      f"ARK: {sheet_name}",
                  )
                  write(
                      report,
                      "=" * 72,
                  )

                  raw = pd.read_excel(
                      OUTPUT,
                      sheet_name=sheet_name,
                      header=None,
                      engine="odf",
                  )

                  write(
                      report,
                      "Rader inklusive rubriker: "
                      f"{len(raw)}",
                  )
                  write(
                      report,
                      "Kolumner: "
                      f"{len(raw.columns)}",
                  )

                  header_row = None

                  for index, row in raw.iterrows():
                      values = [
                          str(value).lower()
                          for value in row.tolist()
                          if pd.notna(value)
                      ]

                      joined = " ".join(values)

                      if (
                          (
                              "emittent"
                              in joined
                              or "issuer"
                              in joined
                          )
                          and
                          (
                              "position"
                              in joined
                              or "nettoposition"
                              in joined
                          )
                      ):
                          header_row = index
                          break

                  if header_row is None:
                      write(
                          report,
                          "Kunde inte identifiera "
                          "rubrikrad.",
                      )
                      continue

                  write(
                      report,
                      "Identifierad rubrikrad: "
                      f"{header_row}",
                  )

                  frame = pd.read_excel(
                      OUTPUT,
                      sheet_name=sheet_name,
                      header=header_row,
                      engine="odf",
                  )

                  frame = frame.dropna(
                      how="all"
                  )

                  frame.columns = [
                      str(column).strip()
                      for column in frame.columns
                  ]

                  write(
                      report,
                  )
                  write(
                      report,
                      "DATAKOLUMNER",
                  )

                  for number, column in enumerate(
                      frame.columns
                  ):
                      write(
                          report,
                          f"{number}: {column}",
                      )

                  write(
                      report,
                      f"Antal datarader: {len(frame)}",
                  )

                  issuer_column = find_column(
                      list(frame.columns),
                      ("emittent",),
                      ("issuer",),
                  )

                  lei_column = find_column(
                      list(frame.columns),
                      ("lei",),
                  )

                  position_column = find_column(
                      list(frame.columns),
                      ("position",),
                      ("nettoposition",),
                      ("blankning",),
                  )

                  date_column = find_column(
                      list(frame.columns),
                      ("positionsdatum",),
                      ("position", "date"),
                      ("datum",),
                      ("date",),
                  )

                  write(
                      report,
                  )
                  write(
                      report,
                      "=" * 72,
                  )
                  write(
                      report,
                      "SAMMANFATTNING",
                  )
                  write(
                      report,
                      "=" * 72,
                  )

                  write(
                      report,
                      "Emittentkolumn: "
                      f"{issuer_column}",
                  )

                  if issuer_column:
                      write(
                          report,
                          "Unika emittenter: "
                          f"{frame[issuer_column].nunique()}",
                      )

                  write(
                      report,
                      "LEI-kolumn: "
                      f"{lei_column}",
                  )

                  if lei_column:
                      write(
                          report,
                          "Unika LEI: "
                          f"{frame[lei_column].nunique()}",
                      )

                  write(
                      report,
                      "Positionskolumn: "
                      f"{position_column}",
                  )

                  write(
                      report,
                      "Datumkolumn: "
                      f"{date_column}",
                  )

                  if date_column:
                      dates = pd.to_datetime(
                          frame[date_column],
                          errors="coerce",
                      )

                      valid_dates = dates.dropna()

                      write(
                          report,
                          "Giltiga datum: "
                          f"{len(valid_dates)}",
                      )

                      write(
                          report,
                          "Unika datum: "
                          f"{valid_dates.nunique()}",
                      )

                      if not valid_dates.empty:
                          write(
                              report,
                              "Äldsta datum: "
                              f"{valid_dates.min().date().isoformat()}",
                          )

                          write(
                              report,
                              "Senaste datum: "
                              f"{valid_dates.max().date().isoformat()}",
                          )

                          write(
                              report,
                          )
                          write(
                              report,
                              "DATUMFÖRDELNING",
                          )

                          monthly = (
                              valid_dates
                              .dt.to_period("M")
                              .value_counts()
                              .sort_index()
                          )

                          for period, count in (
                              monthly.items()
                          ):
                              write(
                                  report,
                                  f"{period}: {count}",
                              )

                  if position_column:
                      positions = pd.to_numeric(
                          frame[position_column],
                          errors="coerce",
                      )

                      valid_positions = (
                          positions.dropna()
                      )

                      write(
                          report,
                      )
                      write(
                          report,
                          "POSITIONER",
                      )

                      write(
                          report,
                          "Giltiga positioner: "
                          f"{len(valid_positions)}",
                      )

                      if not valid_positions.empty:
                          write(
                              report,
                              "Min position: "
                              f"{valid_positions.min()}",
                          )

                          write(
                              report,
                              "Max position: "
                              f"{valid_positions.max()}",
                          )

                          below_half = (
                              valid_positions < 0.5
                          )

                          write(
                              report,
                              "Positioner < 0,5 %: "
                              f"{below_half.sum()}",
                          )

                          at_or_above_half = (
                              valid_positions >= 0.5
                          )

                          write(
                              report,
                              "Positioner >= 0,5 %: "
                              f"{at_or_above_half.sum()}",
                          )

                          write(
                              report,
                              "Unika positionsvärden: "
                              f"{valid_positions.nunique()}",
                          )

                  write(
                      report,
                  )
                  write(
                      report,
                      "FÖRSTA 20 DATARADERNA",
                  )
                  write(
                      report,
                      "-" * 72,
                  )

                  write(
                      report,
                      frame.head(20).to_string(
                          index=False,
                      ),
                  )

                  write(
                      report,
                  )
                  write(
                      report,
                      "SISTA 20 DATARADERNA",
                  )
                  write(
                      report,
                      "-" * 72,
                  )

                  write(
                      report,
                      frame.tail(20).to_string(
                          index=False,
                      ),
                  )

          print()
          print("=" * 72)
          print("KLART")
          print("=" * 72)
          print(
              "Fullständig rapport sparad i:",
              REPORT,
          )
          print(
              "ODS sparad i:",
              OUTPUT,
          )
          PY

      - name: Ladda upp analys
        uses: actions/upload-artifact@v4
        with:
          name: fi-history-investigation
          path: |
            fi-history-report.txt
            fi-historical.ods
          if-no-files-found: error
          retention-days: 14
