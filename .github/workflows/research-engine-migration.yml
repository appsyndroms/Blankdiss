name: Research Engine Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migration comparator tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/ml/research/test_migration_comparator.py

      - name: Run existing FI short-interest event-risk migration
        env:
          PYTHONPATH: .
        run: |
          python -m ml.research.custom.fi_short_interest_event_risk_interaction_migration

      - name: Run migration comparator for FI event-risk interaction
        env:
          PYTHONPATH: .
        run: |
          python -m ml.research.migration_comparator \
            --analysis fi_short_interest_event_risk_interaction \
            --old data/processed/ml/research/migration/fi_short_interest_event_risk_interaction_old.json \
            --new data/processed/ml/research/migration/fi_short_interest_event_risk_interaction_new.json \
            --output data/processed/ml/research/migration/fi_short_interest_event_risk_interaction_comparison.json

      - name: Run migration comparator for SI event-risk grid
        env:
          PYTHONPATH: .
        run: |
          python -m ml.research.migration_comparator \
            --analysis si_event_risk_grid \
            --old data/processed/ml/research/migration/si_event_risk_grid_old.json \
            --new data/processed/ml/research/migration/si_event_risk_grid_new.json \
            --output data/processed/ml/research/migration/si_event_risk_grid_comparison.json

      - name: Upload migration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-migration
          path: |
            data/processed/ml/research/migration/
          if-no-files-found: ignore
