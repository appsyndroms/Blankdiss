name: Research Engine Migration Check

on:
  workflow_dispatch:

jobs:
  migration-check:
    name: Research Engine Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generic migration comparator
        run: |
          python -m ml.research.migration_comparator

      - name: Upload migration comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-migration-comparison
          path: data/processed/ml/research/migration/
          if-no-files-found: warn
