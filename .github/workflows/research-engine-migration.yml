name: Research Engine Migration Check

on:
  workflow_dispatch:

jobs:
  migration-check:
    name: Research Engine Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generic migration comparator
        run: |
          python -m ml.research.migration_comparator

      - name: Run generic migration regression tests
        run: |
          pytest -q tests/ml/research/test_migration_comparator.py

      - name: Run SI prior-return interaction migration comparator
        run: |
          python -m ml.research.custom.si_prior_return_interaction_migration

      - name: Run FI short-interest event-risk interaction migration comparator
        run: |
          python -m ml.research.custom.fi_short_interest_event_risk_interaction_migration

      - name: Upload migration comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-migration-comparison
          path: |
            data/processed/ml/research/migration/old_new_generic_comparison.csv
            data/processed/ml/research/migration/old_new_generic_comparison.md
            data/processed/ml/research/migration/si_prior_return_interaction_window_1_analysis.csv
            data/processed/ml/research/migration/si_prior_return_interaction_window_1_thresholds.csv
            data/processed/ml/research/migration/si_prior_return_interaction_window_2_analysis.csv
            data/processed/ml/research/migration/si_prior_return_interaction_window_2_thresholds.csv
            data/processed/ml/research/migration/si_prior_return_interaction_migration.md
            data/processed/ml/research/migration/fi_short_interest_event_risk_interaction_window_1.csv
            data/processed/ml/research/migration/fi_short_interest_event_risk_interaction_window_1_metrics.csv
            data/processed/ml/research/migration/fi_short_interest_event_risk_interaction_window_2.csv
            data/processed/ml/research/migration/fi_short_interest_event_risk_interaction_window_2_metrics.csv
            data/processed/ml/research/migration/fi_short_interest_event_risk_interaction_migration.md
          if-no-files-found: warn
