name: Check OOS uniqueness

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Kontrollera OOS-dubbletter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find latest Blankdiss artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Letar efter senaste lyckade Blankdiss-workflow..."

          RUN_ID="$(
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow blankdiss.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"

          if [ -z "$RUN_ID" ]; then
            echo "Hittade inget lyckat Blankdiss-workflow."
            exit 1
          fi

          echo "Senaste Blankdiss run: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download OOS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p artifacts

          echo "Hämtar artifacts från run $RUN_ID..."

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --dir artifacts

          echo
          echo "Nedladdade artifacts:"
          find artifacts -maxdepth 3 -type f -printf '%p %s bytes\n'

          OOS_FILE="$(
            find artifacts \
              -type f \
              -name "oos_predictions.jsonl" \
              -print \
              -quit
          )"

          if [ -z "$OOS_FILE" ]; then
            echo
            echo "Hittade inte oos_predictions.jsonl."
            exit 1
          fi

          echo
          echo "OOS-fil:"
          ls -lh "$OOS_FILE"

          echo "OOS_FILE=$OOS_FILE" >> "$GITHUB_ENV"

      - name: Check OOS uniqueness
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          path = Path("${{ env.OOS_FILE }}")

          total_rows = 0
          unique_keys = set()
          counts = defaultdict(int)
          invalid_rows = 0

          with path.open("r", encoding="utf-8") as f:
              for line_number, line in enumerate(f, start=1):
                  line = line.strip()

                  if not line:
                      continue

                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      invalid_rows += 1
                      continue

                  total_rows += 1

                  feature_set = row.get("feature_set")
                  target = row.get("target")
                  window = row.get("window")
                  snapshot_date = row.get("snapshot_date")
                  security_key = row.get("security_key")

                  window_key = json.dumps(
                      window,
                      sort_keys=True,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )

                  key = (
                      feature_set,
                      target,
                      window_key,
                      snapshot_date,
                      security_key,
                  )

                  unique_keys.add(key)
                  counts[key] += 1

          duplicate_groups = sum(
              1
              for count in counts.values()
              if count > 1
          )

          duplicate_rows = sum(
              count - 1
              for count in counts.values()
              if count > 1
          )

          max_multiplicity = max(
              counts.values(),
              default=0,
          )

          print()
          print("==========================================")
          print("OOS UNIQUENESS CHECK")
          print("==========================================")
          print(f"OOS rows:          {total_rows:,}")
          print(f"Unique keys:       {len(unique_keys):,}")
          print(f"Duplicate rows:    {duplicate_rows:,}")
          print(f"Duplicate groups:  {duplicate_groups:,}")
          print(f"Max multiplicity:  {max_multiplicity}")
          print(f"Invalid JSON rows: {invalid_rows:,}")
          print("==========================================")
          print()

          if duplicate_groups:
              print("Exempel på dubblettgrupper:")
              print("------------------------------------------")

              shown = 0

              for key, count in counts.items():
                  if count <= 1:
                      continue

                  (
                      feature_set,
                      target,
                      window_key,
                      snapshot_date,
                      security_key,
                  ) = key

                  print(
                      f"count={count} | "
                      f"feature_set={feature_set} | "
                      f"target={target} | "
                      f"date={snapshot_date} | "
                      f"security={security_key}"
                  )

                  print(f"window={window_key}")

                  shown += 1

                  if shown >= 10:
                      break

              print("------------------------------------------")
          else:
              print("Inga exakta dubblettgrupper hittades.")

          if invalid_rows:
              raise SystemExit(
                  f"{invalid_rows} rader kunde inte parsas som JSON."
              )
          PY
