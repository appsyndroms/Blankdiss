name: Delete workflow runs

on:
  workflow_dispatch:

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --limit 1000 \
            --json databaseId \
            --jq '.[].databaseId' |
          while read -r id; do
            echo "Deleting run $id"
            gh run delete "$id" --repo "${{ github.repository }}"
          done
