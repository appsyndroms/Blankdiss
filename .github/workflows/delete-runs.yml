name: Delete workflow runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --limit 1000 \
            --json databaseId \
            --jq '.[].databaseId' |
          while read -r id; do
            if [ "$id" != "${GITHUB_RUN_ID}" ]; then
              echo "Deleting run $id"
              gh run delete "$id" --repo "${github.repository}"
            fi
          done
